          package com.jiexin.floatinginput;

          import android.content.Context;
          import android.content.SharedPreferences;

          import org.json.JSONArray;
          import org.json.JSONObject;

          import java.util.ArrayList;
          import java.util.List;

          public class HistoryManager {

              public static class Item {

                  public String text;
                  public String type;
                  public long time;

                  public Item(
                          String text,
                          String type,
                          long time
                  ) {
                      this.text = text;
                      this.type = type;
                      this.time = time;
                  }
              }

              private static final String PREF = "history_data";
              private static final String KEY = "items";

              public static synchronized List<Item> load(
                      Context context
              ) {

                  List<Item> result = new ArrayList<>();

                  SharedPreferences prefs =
                          context.getSharedPreferences(
                                  PREF,
                                  Context.MODE_PRIVATE
                          );

                  String raw =
                          prefs.getString(KEY, "[]");

                  try {

                      JSONArray array =
                              new JSONArray(raw);

                      for (
                          int i = 0;
                          i < array.length();
                          i++
                      ) {

                          JSONObject object =
                                  array.getJSONObject(i);

                          result.add(
                                  new Item(
                                          object.optString("text", ""),
                                          object.optString("type", "输入"),
                                          object.optLong("time", 0)
                                  )
                          );
                      }

                  } catch (Exception ignored) {
                  }

                  return result;
              }

              public static synchronized void save(
                      Context context,
                      List<Item> items
              ) {

                  JSONArray array = new JSONArray();

                  try {

                      for (Item item : items) {

                          JSONObject object =
                                  new JSONObject();

                          object.put("text", item.text);
                          object.put("type", item.type);
                          object.put("time", item.time);

                          array.put(object);
                      }

                  } catch (Exception ignored) {
                  }

                  context
                          .getSharedPreferences(
                                  PREF,
                                  Context.MODE_PRIVATE
                          )
                          .edit()
                          .putString(
                                  KEY,
                                  array.toString()
                          )
                          .apply();
              }

              public static synchronized void add(
                      Context context,
                      String text,
                      String type
              ) {

                  if (text == null) return;

                  text = text.trim();

                  if (text.isEmpty()) return;

                  List<Item> items =
                          load(context);

                  for (
                          int i = items.size() - 1;
                          i >= 0;
                          i--
                  ) {

                      if (
                          items.get(i)
                                  .text
                                  .equals(text)
                      ) {

                          items.remove(i);
                      }
                  }

                  items.add(
                          0,
                          new Item(
                                  text,
                                  type,
                                  System.currentTimeMillis()
                          )
                  );

                  while (
                      items.size() > 500
                  ) {

                      items.remove(
                              items.size() - 1
                      );
                  }

                  save(context, items);
              }

              public static synchronized void clear(
                      Context context
              ) {

                  context
                          .getSharedPreferences(
                                  PREF,
                                  Context.MODE_PRIVATE
                          )
                          .edit()
                          .remove(KEY)
                          .apply();
              }
          }
          EOF

          cat > app/src/main/java/com/jiexin/floatinginput/MainActivity.java <<'EOF'
          package com.jiexin.floatinginput;

          import android.Manifest;
          import android.app.Activity;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.graphics.Color;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.provider.Settings;
          import android.widget.FrameLayout;
          import android.widget.Toast;

          public class MainActivity extends Activity {

              private boolean overlayPermissionRequested = false;
              private boolean started = false;

              @Override
              protected void onCreate(
                      Bundle savedInstanceState
              ) {

                  super.onCreate(savedInstanceState);

                  FrameLayout root =
                          new FrameLayout(this);

                  root.setBackgroundColor(
                          Color.TRANSPARENT
                  );

                  setContentView(root);

                  getSharedPreferences(
                          "floating_settings",
                          MODE_PRIVATE
                  )
                  .edit()
                  .putInt(
                          "alpha_percent",
                          90
                  )
                  .apply();

                  checkNormalPermissions();
              }

              private void checkNormalPermissions() {

                  boolean locationMissing =
                          Build.VERSION.SDK_INT >= 23 &&
                          checkSelfPermission(
                                  Manifest.permission.ACCESS_FINE_LOCATION
                          ) != PackageManager.PERMISSION_GRANTED;

                  boolean activityMissing =
                          Build.VERSION.SDK_INT >= 29 &&
                          checkSelfPermission(
                                  Manifest.permission.ACTIVITY_RECOGNITION
                          ) != PackageManager.PERMISSION_GRANTED;

                  if (
                      locationMissing ||
                      activityMissing
                  ) {

                      Intent intent =
                              new Intent(
                                      this,
                                      PermissionActivity.class
                              );

                      startActivityForResult(
                              intent,
                              1001
                      );

                  } else {

                      checkOverlayPermission();
                  }
              }

              @Override
              protected void onActivityResult(
                      int requestCode,
                      int resultCode,
                      Intent data
              ) {

                  super.onActivityResult(
                          requestCode,
                          resultCode,
                          data
                  );

                  if (requestCode == 1001) {

                      checkOverlayPermission();
                  }
              }

              private void checkOverlayPermission() {

                  if (
                      Build.VERSION.SDK_INT <
                      Build.VERSION_CODES.M ||
                      Settings.canDrawOverlays(this)
                  ) {

                      startOverlay();

                  } else {

                      overlayPermissionRequested = true;

                      Toast.makeText(
                              this,
                              "请允许“显示在其他应用上层”",
                              Toast.LENGTH_LONG
                      ).show();

                      Intent intent =
                              new Intent(
                                      Settings.ACTION_MANAGE_OVERLAY_PERMISSION,
                                      Uri.parse(
                                              "package:" +
                                              getPackageName()
                                      )
                              );

                      startActivity(intent);
                  }
              }

              @Override
              protected void onResume() {

                  super.onResume();

                  if (
                      overlayPermissionRequested &&
                      (
                          Build.VERSION.SDK_INT <
                          Build.VERSION_CODES.M ||
                          Settings.canDrawOverlays(this)
                      )
                  ) {

                      overlayPermissionRequested = false;

                      startOverlay();
                  }
              }

              private void startOverlay() {

                  if (started) return;

                  started = true;

                  Intent service =
                          new Intent(
                                  this,
                                  FloatingService.class
                          );

                  service.setAction(
                          "OPEN_AND_KEYBOARD"
                  );

                  if (
                      Build.VERSION.SDK_INT >=
                      Build.VERSION_CODES.O
                  ) {

                      startForegroundService(service);

                  } else {

                      startService(service);
                  }

                  finish();
              }
          }
          EOF

