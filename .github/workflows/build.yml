              /*
               * ==============================
               * 计步
               * ==============================
               */
              private void startStepCounter() {

                  if (
                      Build.VERSION.SDK_INT >= 29 &&
                      checkSelfPermission(
                              Manifest.permission.ACTIVITY_RECOGNITION
                      ) != PackageManager.PERMISSION_GRANTED
                  ) {

                      stepText.setText(
                              "今日步数：无权限"
                      );

                      return;
                  }

                  sensorManager =
                          (SensorManager)
                          getSystemService(
                                  SENSOR_SERVICE
                          );

                  if (sensorManager == null) {

                      stepText.setText(
                              "今日步数：不支持"
                      );

                      return;
                  }

                  stepSensor =
                          sensorManager.getDefaultSensor(
                                  Sensor.TYPE_STEP_COUNTER
                          );

                  if (stepSensor == null) {

                      stepText.setText(
                              "今日步数：不支持"
                      );

                      return;
                  }

                  sensorManager.registerListener(
                          this,
                          stepSensor,
                          SensorManager.SENSOR_DELAY_NORMAL
                  );
              }

              @Override
              public void onSensorChanged(
                      SensorEvent event
              ) {

                  if (
                      event.sensor.getType() !=
                      Sensor.TYPE_STEP_COUNTER
                  ) {

                      return;
                  }

                  float total =
                          event.values[0];

                  String day =
                          new SimpleDateFormat(
                                  "yyyyMMdd",
                                  Locale.getDefault()
                          )
                          .format(
                                  new Date()
                          );

                  String oldDay =
                          prefs.getString(
                                  "step_day",
                                  ""
                          );

                  float base =
                          prefs.getFloat(
                                  "step_base",
                                  -1f
                          );

                  if (
                      !day.equals(oldDay) ||
                      base < 0 ||
                      total < base
                  ) {

                      base = total;

                      prefs.edit()
                              .putString(
                                      "step_day",
                                      day
                              )
                              .putFloat(
                                      "step_base",
                                      base
                              )
                              .apply();
                  }

                  int steps =
                          Math.max(
                                  0,
                                  Math.round(
                                          total -
                                          base
                                  )
                          );

                  final int finalSteps =
                          steps;

                  handler.post(
                          () -> {

                      if (
                          stepText != null
                      ) {

                          stepText.setText(
                                  "今日步数：" +
                                  finalSteps +
                                  " 步"
                          );
                      }
                  });
              }

              @Override
              public void onAccuracyChanged(
                      Sensor sensor,
                      int accuracy
              ) {
              }

              /*
               * ==============================
               * 定位天气
               * ==============================
               */
              private void startWeather() {

                  if (
                      Build.VERSION.SDK_INT >= 23 &&
                      checkSelfPermission(
                              Manifest.permission.ACCESS_FINE_LOCATION
                      ) != PackageManager.PERMISSION_GRANTED &&
                      checkSelfPermission(
                              Manifest.permission.ACCESS_COARSE_LOCATION
                      ) != PackageManager.PERMISSION_GRANTED
                  ) {

                      weatherText.setText(
                              "气温：无定位权限"
                      );

                      return;
                  }

                  locationManager =
                          (LocationManager)
                          getSystemService(
                                  LOCATION_SERVICE
                          );

                  if (
                      locationManager == null
                  ) {

                      weatherText.setText(
                              "气温：定位不可用"
                      );

                      return;
                  }

                  locationListener =
                          new LocationListener() {

                              @Override
                              public void onLocationChanged(
                                      Location location
                              ) {

                                  useLocation(
                                          location
                                  );
                              }

                              @Override
                              public void onStatusChanged(
                                      String provider,
                                      int status,
                                      Bundle extras
                              ) {
                              }

                              @Override
                              public void onProviderEnabled(
                                      String provider
                              ) {
                              }

                              @Override
                              public void onProviderDisabled(
                                      String provider
                              ) {
                              }
                          };

                  try {

                      Location best = null;

                      Location gps =
                              locationManager
                                      .getLastKnownLocation(
                                              LocationManager.GPS_PROVIDER
                                      );

                      Location network =
                              locationManager
                                      .getLastKnownLocation(
                                              LocationManager.NETWORK_PROVIDER
                                      );

                      if (
                          gps != null &&
                          network != null
                      ) {

                          best =
                                  gps.getTime() >
                                  network.getTime()
                                          ? gps
                                          : network;

                      } else if (
                          gps != null
                      ) {

                          best = gps;

                      } else if (
                          network != null
                      ) {

                          best = network;
                      }

                      if (best != null) {

                          useLocation(best);
                      }

                      if (
                          locationManager.isProviderEnabled(
                                  LocationManager.NETWORK_PROVIDER
                          )
                      ) {

                          locationManager.requestLocationUpdates(
                                  LocationManager.NETWORK_PROVIDER,
                                  300000,
                                  100,
                                  locationListener
                          );
                      }

                      if (
                          locationManager.isProviderEnabled(
                                  LocationManager.GPS_PROVIDER
                          )
                      ) {

                          locationManager.requestLocationUpdates(
                                  LocationManager.GPS_PROVIDER,
                                  300000,
                                  100,
                                  locationListener
                          );
                      }

                  } catch (
                          Exception e
                  ) {

                      weatherText.setText(
                              "气温：定位失败"
                      );
                  }
              }

              private void useLocation(
                      Location location
              ) {

                  if (location == null) return;

                  latitude =
                          location.getLatitude();

                  longitude =
                          location.getLongitude();

                  hasLocation = true;

                  long now =
                          System.currentTimeMillis();

                  if (
                      now -
                      lastWeatherRequest >
                      300000
                  ) {

                      lastWeatherRequest = now;

                      requestWeather(
                              latitude,
                              longitude
                      );
                  }
              }

              private void requestWeather(
                      double lat,
                      double lon
              ) {

                  handler.post(
                          () -> {

                      if (
                          weatherText != null
                      ) {

                          weatherText.setText(
                                  "气温：更新中…"
                          );
                      }
                  });

                  new Thread(
                          () -> {

                      HttpURLConnection connection =
                              null;

                      try {

                          String address =
                                  "https://api.open-meteo.com/v1/forecast" +
                                  "?latitude=" +
                                  lat +
                                  "&longitude=" +
                                  lon +
                                  "&current=temperature_2m" +
                                  "&temperature_unit=celsius";

                          URL url =
                                  new URL(address);

                          connection =
                                  (HttpURLConnection)
                                  url.openConnection();

                          connection.setRequestMethod(
                                  "GET"
                          );

                          connection.setConnectTimeout(
                                  10000
                          );

                          connection.setReadTimeout(
                                  10000
                          );

                          connection.setRequestProperty(
                                  "Accept",
                                  "application/json"
                          );

                          int code =
                                  connection.getResponseCode();

                          if (
                              code < 200 ||
                              code >= 300
                          ) {

                              throw new Exception(
                                      "HTTP " +
                                      code
                              );
                          }

                          BufferedReader reader =
                                  new BufferedReader(
                                          new InputStreamReader(
                                                  connection
                                                          .getInputStream(),
                                                  "UTF-8"
                                          )
                                  );

                          StringBuilder result =
                                  new StringBuilder();

                          String line;

                          while (
                              (line = reader.readLine())
                              != null
                          ) {

                              result.append(line);
                          }

                          reader.close();

                          JSONObject root =
                                  new JSONObject(
                                          result.toString()
                                  );

                          JSONObject current =
                                  root.getJSONObject(
                                          "current"
                                  );

                          double temp =
                                  current.getDouble(
                                          "temperature_2m"
                                  );

                          String value =
                                  String.format(
                                          Locale.getDefault(),
                                          "%.1f°C",
                                          temp
                                  );

                          handler.post(
                                  () -> {

                              if (
                                  weatherText != null
                              ) {

                                  weatherText.setText(
                                          "气温：" +
                                          value
                                  );
                              }
                          });

                      } catch (
                          Exception e
                      ) {

                          handler.post(
                                  () -> {

                              if (
                                  weatherText != null
                              ) {

                                  weatherText.setText(
                                          "气温：获取失败"
                                  );
                              }
                          });

                      } finally {

                          if (
                              connection != null
                          ) {

                              connection.disconnect();
                          }
                      }
                  }).start();
              }

              /*
               * ==============================
               * 移动悬浮窗
               * ==============================
               */
              private void setupMove() {

                  moveButton.setOnTouchListener(
                          (v, event) -> {

                      switch (
                              event.getActionMasked()
                      ) {

                          case MotionEvent.ACTION_DOWN:

                              moveStartRawX =
                                      event.getRawX();

                              moveStartRawY =
                                      event.getRawY();

                              moveStartX =
                                      params.x;

                              moveStartY =
                                      params.y;

                              return true;

                          case MotionEvent.ACTION_MOVE:

                              params.x =
                                      moveStartX +
                                      (int) (
                                          event.getRawX() -
                                          moveStartRawX
                                      );

                              params.y =
                                      moveStartY +
                                      (int) (
                                          event.getRawY() -
                                          moveStartRawY
                                      );

                              try {

                                  windowManager
                                          .updateViewLayout(
                                                  rootView,
                                                  params
                                          );

                              } catch (
                                  Exception ignored
                              ) {
                              }

                              return true;

                          case MotionEvent.ACTION_UP:

                          case MotionEvent.ACTION_CANCEL:

                              saveSettings();

                              return true;
                      }

                      return true;
                  });
              }

              /*
               * ==============================
               * ↘ 拖动缩放 / 点击换行
               * ==============================
               */
              private void setupResize() {

                  resizeButton.setOnTouchListener(
                          (v, event) -> {

                      switch (
                              event.getActionMasked()
                      ) {

                          case MotionEvent.ACTION_DOWN:

                              resizeStartRawX =
                                      event.getRawX();

                              resizeStartRawY =
                                      event.getRawY();

                              resizeStartWidth =
                                      params.width;

                              resizeStartHeight =
                                      params.height;

                              resized = false;

                              return true;

                          case MotionEvent.ACTION_MOVE:

                              int dx =
                                      (int) (
                                          event.getRawX() -
                                          resizeStartRawX
                                      );

                              int dy =
                                      (int) (
                                          event.getRawY() -
                                          resizeStartRawY
                                      );

                              if (
                                  Math.abs(dx) >
                                  dp(12) ||
                                  Math.abs(dy) >
                                  dp(12)
                              ) {

                                  resized = true;
                              }

                              if (resized) {

                                  int screenWidth =
                                          getResources()
                                                  .getDisplayMetrics()
                                                  .widthPixels;

                                  int screenHeight =
                                          getResources()
                                                  .getDisplayMetrics()
                                                  .heightPixels;

                                  params.width =
                                          Math.max(
                                                  dp(270),
                                                  Math.min(
                                                          resizeStartWidth +
                                                          dx,
                                                          screenWidth
                                                  )
                                          );

                                  params.height =
                                          Math.max(
                                                  dp(280),
                                                  Math.min(
                                                          resizeStartHeight +
                                                          dy,
                                                          screenHeight
                                                  )
                                          );

                                  try {

                                      windowManager
                                              .updateViewLayout(
                                                      rootView,
                                                      params
                                              );

                                  } catch (
                                      Exception ignored
                                  ) {
                                  }
                              }

                              return true;

                          case MotionEvent.ACTION_UP:

                              if (resized) {

                                  saveSettings();

                              } else {

                                  insertNewLine();
                              }

                              return true;

                          case MotionEvent.ACTION_CANCEL:

                              if (resized) {

                                  saveSettings();
                              }

                              return true;
                      }

                      return true;
                  });
              }

              private void insertNewLine() {

                  Editable editable =
                          inputBox.getText();

                  int start =
                          inputBox.getSelectionStart();

                  int end =
                          inputBox.getSelectionEnd();

                  if (start < 0) {

                      start =
                              editable.length();
                  }

                  if (end < 0) {

                      end = start;
                  }

                  int min =
                          Math.min(
                                  start,
                                  end
                          );

                  int max =
                          Math.max(
                                  start,
                                  end
                          );

                  editable.replace(
                          min,
                          max,
                          "\n"
                  );

                  inputBox.setSelection(
                          Math.min(
                                  min + 1,
                                  editable.length()
                          )
                  );

                  inputBox.requestFocus();

                  showKeyboard();
              }

              /*
               * ==============================
               * 输入网址/百度搜索
               * ==============================
               */
              private void translateInput(
                      String targetLanguage
              ) {

                  final String originalText =
                          inputBox == null
                                  ? ""
                                  : inputBox.getText()
                                          .toString()
                                          .trim();

                  if (originalText.isEmpty()) {

                      Toast.makeText(
                              this,
                              "请先输入需要翻译的文字",
                              Toast.LENGTH_SHORT
                      ).show();

                      return;
                  }

                  final String target =
                          "en".equals(targetLanguage)
                                  ? "en"
                                  : "zh-CN";

                  Toast.makeText(
                          this,
                          "正在翻译…",
                          Toast.LENGTH_SHORT
                  ).show();

                  new Thread(() -> {

                      HttpURLConnection connection = null;

                      try {

                          String encoded =
                                  URLEncoder.encode(
                                          originalText,
                                          "UTF-8"
                                  );

                          URL url = new URL(
                                  "https://translate.googleapis.com/translate_a/single" +
                                  "?client=gtx" +
                                  "&sl=auto" +
                                  "&tl=" + target +
                                  "&dt=t" +
                                  "&q=" + encoded
                          );

                          connection =
                                  (HttpURLConnection)
                                          url.openConnection();

                          connection.setRequestMethod("GET");
                          connection.setConnectTimeout(10000);
                          connection.setReadTimeout(15000);
                          connection.setRequestProperty(
                                  "User-Agent",
                                  "Mozilla/5.0"
                          );

                          int responseCode =
                                  connection.getResponseCode();

                          if (responseCode < 200 ||
                                  responseCode >= 300) {
                              throw new Exception(
                                      "HTTP " + responseCode
                              );
                          }

                          BufferedReader reader =
                                  new BufferedReader(
                                          new InputStreamReader(
                                                  connection.getInputStream(),
                                                  "UTF-8"
                                          )
                                  );

                          StringBuilder body =
                                  new StringBuilder();

                          String line;

                          while ((line = reader.readLine()) != null) {
                              body.append(line);
                          }

                          reader.close();

                          org.json.JSONArray root =
                                  new org.json.JSONArray(
                                          body.toString()
                                  );

                          org.json.JSONArray pieces =
                                  root.getJSONArray(0);

                          StringBuilder translated =
                                  new StringBuilder();

                          for (int i = 0;
                               i < pieces.length();
                               i++) {

                              org.json.JSONArray piece =
                                      pieces.optJSONArray(i);

                              if (piece != null &&
                                      piece.length() > 0 &&
                                      !piece.isNull(0)) {
                                  translated.append(
                                          piece.optString(0, "")
                                  );
                              }
                          }

                          final String result =
                                  translated.toString().trim();

                          if (result.isEmpty()) {
                              throw new Exception(
                                      "empty translation"
                              );
                          }

                          handler.post(() -> {

                              if (inputBox == null) {
                                  return;
                              }

                              String currentText =
                                      inputBox.getText().toString();

                              String combinedText;
                              if (currentText.trim().isEmpty()) {
                                  combinedText = result;
                              } else {
                                  combinedText =
                                          currentText +
                                          "\\n" +
                                          result;
                              }

                              inputBox.setText(combinedText);
                              inputBox.setSelection(
                                      inputBox.length()
                              );

                              prefs.edit()
                                      .putString(
                                              "last_input_text",
                                              result
                                      )
                                      .apply();

                              inputBox.requestFocus();
                              showKeyboard();

                              Toast.makeText(
                                      FloatingService.this,
                                      "翻译完成",
                                      Toast.LENGTH_SHORT
                              ).show();
                          });

                      } catch (Exception e) {

                          handler.post(() ->
                                  Toast.makeText(
                                          FloatingService.this,
                                          "翻译失败，请检查网络后重试",
                                          Toast.LENGTH_SHORT
                                  ).show()
                          );

                      } finally {

                          if (connection != null) {
                              connection.disconnect();
                          }
                      }
                  }).start();
              }

              private void openText() {

                  String text =
                          inputBox
                                  .getText()
                                  .toString()
                                  .trim();

                  if (text.isEmpty()) {

                      Toast.makeText(
                              this,
                              "请输入网址或搜索内容",
                              Toast.LENGTH_SHORT
                      ).show();

                      return;
                  }

                  if (
                      text.contains("\n")
                  ) {

                      text =
                              text.split("\n")[0]
                                      .trim();
                  }

                  String lower =
                          text.toLowerCase(
                                  Locale.ROOT
                          );

                  boolean hasScheme =
                          lower.startsWith(
                                  "http://"
                          ) ||
                          lower.startsWith(
                                  "https://"
                          );

                  String check =
                          lower.replaceFirst(
                                  "^https?://",
                                  ""
                          );

                  int slash =
                          check.indexOf("/");

                  String host =
                          slash >= 0
                                  ? check.substring(
                                          0,
                                          slash
                                  )
                                  : check;

                  boolean url =
                          hasScheme ||
                          (
                              host.contains(".") &&
                              !host.contains(" ") &&
                              !host.contains("。")
                          );

                  String destination;

                  if (url) {

                      destination =
                              hasScheme
                                      ? text
                                      : "https://" +
                                      text;

                      HistoryManager.add(
                              this,
                              text,
                              "打开网址"
                      );

                  } else {

                      try {

                          destination =
                                  "https://www.baidu.com/s?wd=" +
                                  URLEncoder.encode(
                                          text,
                                          "UTF-8"
                                  );

                      } catch (
                          Exception e
                      ) {

                          return;
                      }

                      HistoryManager.add(
                              this,
                              text,
                              "百度搜索"
                      );
                  }

                  try {

                      Intent intent =
                              new Intent(
                                      Intent.ACTION_VIEW,
                                      Uri.parse(
                                              destination
                                      )
                              );

                      intent.addFlags(
                              Intent.FLAG_ACTIVITY_NEW_TASK
                      );

                      startActivity(intent);

                      closeEverything();

                  } catch (
                          Exception e
                  ) {

                      Toast.makeText(
                              this,
                              "无法打开",
                              Toast.LENGTH_SHORT
                      ).show();
                  }
              }

              private void saveInputHistory() {

                  if (inputBox == null) return;

                  String text =
                          inputBox
                                  .getText()
                                  .toString()
                                  .trim();

                  if (!text.isEmpty()) {

                      HistoryManager.add(
                              this,
                              text,
                              "输入"
                      );
                  }
              }

              private void saveSettings() {

                  if (params == null) return;

                  prefs.edit()
                          .putInt(
                                  "x",
                                  params.x
                          )
                          .putInt(
                                  "y",
                                  params.y
                          )
                          .putInt(
                                  "width",
                                  params.width
                          )
                          .putInt(
                                  "height",
                                  params.height
                          )
                          .putInt(
                                  "alpha_percent",
                                  alphaPercent
                          )
                          .putInt(
                                  "font_color_index",
                                  fontColorIndex
                          )
                          .apply();
              }

              private void showOverlay() {

                  if (
                      rootView != null
                  ) {

                      rootView.setVisibility(
                              View.VISIBLE
                      );

                      hidden = false;
                  }
              }

              private void showKeyboard() {

                  if (
                      inputBox == null ||
                      hidden
                  ) {

                      return;
                  }

                  inputBox.postDelayed(
                          () -> {

                              try {

                                  inputBox.setFocusable(
                                          true
                                  );

                                  inputBox.setFocusableInTouchMode(
                                          true
                                  );

                                  inputBox.requestFocus();

                                  inputBox.setSelection(
                                          inputBox
                                                  .getText()
                                                  .length()
                                  );

                                  InputMethodManager imm =
                                          (InputMethodManager)
                                          getSystemService(
                                                  INPUT_METHOD_SERVICE
                                          );

                                  if (imm != null) {

                                      imm.showSoftInput(
                                              inputBox,
                                              InputMethodManager.SHOW_IMPLICIT
                                      );
                                  }

                              } catch (
                                  Exception ignored
                              ) {
                              }

                          },
                          300
                  );
              }

              private void hideKeyboard() {

                  try {

                      InputMethodManager imm =
                              (InputMethodManager)
                              getSystemService(
                                      INPUT_METHOD_SERVICE
                              );

                      if (
                          imm != null &&
                          inputBox != null
                      ) {

                          imm.hideSoftInputFromWindow(
                                  inputBox.getWindowToken(),
                                  0
                          );

                          inputBox.clearFocus();
                      }

                  } catch (
                      Exception ignored
                  ) {
                  }
              }

              private void closeEverything() {

                  saveInputHistory();

                  saveSettings();

                  /*
                   * 下次打开透明度重新90%。
                   */
                  prefs.edit()
                          .putInt(
                                  "alpha_percent",
                                  90
                          )
                          .apply();

                  hideKeyboard();

                  try {

                      ActivityManager manager =
                              (ActivityManager)
                              getSystemService(
                                      ACTIVITY_SERVICE
                              );

                      if (manager != null) {

                          for (
                              ActivityManager.AppTask task :
                              manager.getAppTasks()
                          ) {

                              task.finishAndRemoveTask();
                          }
                      }

                  } catch (
                      Exception ignored
                  ) {
                  }

                  stopSelf();
              }

              @Override
              public void onDestroy() {

                  handler.removeCallbacksAndMessages(
                          null
                  );

                  if (
                      sensorManager != null
                  ) {

                      try {

                          sensorManager.unregisterListener(
                                  this
                          );

                      } catch (
                          Exception ignored
                      ) {
                      }
                  }

                  if (
                      locationManager != null &&
                      locationListener != null
                  ) {

                      try {

                          locationManager.removeUpdates(
                                  locationListener
                          );

                      } catch (
                          Exception ignored
                      ) {
                      }
                  }

                  if (
                      params != null
                  ) {

                      prefs.edit()
                              .putInt(
                                      "x",
                                      params.x
                              )
                              .putInt(
                                      "y",
                                      params.y
                              )
                              .putInt(
                                      "width",
                                      params.width
                              )
                              .putInt(
                                      "height",
                                      params.height
                              )
                              .putInt(
                                      "font_color_index",
                                      fontColorIndex
                              )
                              .apply();
                  }

                  if (
                      windowManager != null &&
                      rootView != null
                  ) {

                      try {

                          windowManager.removeView(
                                  rootView
                          );

                      } catch (
                          Exception ignored
                      ) {
                      }
                  }

                  if (
                      Build.VERSION.SDK_INT >=
                      Build.VERSION_CODES.N
                  ) {

                      stopForeground(
                              STOP_FOREGROUND_REMOVE
                      );

                  } else {

                      stopForeground(true);
                  }

                  super.onDestroy();
              }

              @Override
              public IBinder onBind(
                      Intent intent
              ) {

                  return null;
              }
          }
          EOF

      - name: Download Gradle
        shell: bash
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle-8.9-bin.zip
          chmod +x gradle-8.9/bin/gradle

      - name: Build APK
        shell: bash
        run: |
          ./gradle-8.9/bin/gradle assembleDebug --stacktrace

      - name: Prepare APK
        shell: bash
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk FloatingInputApp-V15.8.apk
          ls -lh FloatingInputApp-V15.8.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FloatingInputApp-V15.8-APK
          path: FloatingInputApp-V15.8.apk
          if-no-files-found: error
          retention-days: 30
