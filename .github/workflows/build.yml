                                      SeekBar seekBar
                              ) {

                                  saveSettings();
                              }
                          }
                  );

                  alphaArea.addView(
                          alphaTitle,
                          new LinearLayout.LayoutParams(
                                  dp(58),
                                  dp(52)
                          )
                  );

                  alphaArea.addView(
                          alphaSeekBar,
                          new LinearLayout.LayoutParams(
                                  0,
                                  dp(52),
                                  1f
                          )
                  );

                  alphaArea.addView(
                          alphaText,
                          new LinearLayout.LayoutParams(
                                  dp(52),
                                  dp(52)
                          )
                  );

                  rootView.addView(
                          alphaArea,
                          new LinearLayout.LayoutParams(
                                  ViewGroup.LayoutParams.MATCH_PARENT,
                                  dp(55)
                          )
                  );

                  int type =
                          Build.VERSION.SDK_INT >=
                          Build.VERSION_CODES.O
                                  ? WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY
                                  : WindowManager.LayoutParams.TYPE_PHONE;

                  params =
                          new WindowManager.LayoutParams(
                                  prefs.getInt(
                                          "width",
                                          dp(350)
                                  ),
                                  prefs.getInt(
                                          "height",
                                          dp(300)
                                  ),
                                  type,
                                  WindowManager.LayoutParams.FLAG_NOT_TOUCH_MODAL |
                                  WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN,
                                  PixelFormat.TRANSLUCENT
                          );

                  params.gravity =
                          Gravity.TOP |
                          Gravity.START;

                  params.x =
                          prefs.getInt(
                                  "x",
                                  dp(25)
                          );

                  params.y =
                          prefs.getInt(
                                  "y",
                                  dp(100)
                          );

                  params.softInputMode =
                          WindowManager.LayoutParams.SOFT_INPUT_ADJUST_RESIZE |
                          WindowManager.LayoutParams.SOFT_INPUT_STATE_ALWAYS_VISIBLE;

                  try {

                      windowManager.addView(
                              rootView,
                              params
                      );

                  } catch (
                          Exception e
                  ) {

                      rootView =
                              null;

                      stopSelf();

                      return;
                  }

                  overlayHidden =
                          false;

                  updateAlpha();

                  updateFontColorButton();

                  setupClose(
                          closeButton
                  );

                  setupSettings(
                          settingsButton
                  );

                  setupHistory(
                          historyButton
                  );

                  setupColorButton();

                  setupMove();

                  setupResize();

                  showKeyboard();
              }

              /*
               * ==============================
               * 字体颜色切换
               * ==============================
               */
              private void setupColorButton() {

                  if (
                      colorButton == null
                  ) {

                      return;
                  }

                  colorButton.setOnClickListener(
                          v -> {

                      /*
                       * 黑 -> 红 -> 绿 -> 蓝 -> 黄 -> 黑
                       */
                      fontColorIndex++;

                      if (
                          fontColorIndex >=
                          fontColors.length
                      ) {

                          fontColorIndex =
                                  0;
                      }

                      if (
                          inputBox != null
                      ) {

                          inputBox.setTextColor(
                                  fontColors[
                                          fontColorIndex
                                  ]
                          );
                      }

                      updateFontColorButton();

                      prefs.edit()
                              .putInt(
                                      "font_color_index",
                                      fontColorIndex
                              )
                              .apply();
                  });
              }

              private void updateFontColorButton() {

                  if (
                      colorButton == null
                  ) {

                      return;
                  }

                  colorButton.setText(
                          "字体:" +
                          fontColorNames[
                                  fontColorIndex
                          ]
                  );

                  /*
                   * 按钮本身文字也显示对应颜色，
                   * 更方便看当前颜色。
                   */
                  colorButton.setTextColor(
                          fontColors[
                                  fontColorIndex
                          ]
                  );
              }

              /*
               * ==============================
               * 透明度
               * ==============================
               */
              private void updateAlpha() {

                  if (
                      rootView == null
                  ) {

                      return;
                  }

                  float alpha =
                          alphaPercent /
                          100.0f;

                  rootView.setAlpha(
                          alpha
                  );

                  if (
                      alphaText != null
                  ) {

                      alphaText.setText(
                              alphaPercent +
                              "%"
                      );
                  }
              }

              private void hideOverlay() {

                  hideKeyboard();

                  if (
                      rootView != null
                  ) {

                      rootView.setVisibility(
                              View.GONE
                      );

                      overlayHidden =
                              true;
                  }
              }

              private void showOverlay() {

                  if (
                      rootView != null
                  ) {

                      rootView.setVisibility(
                              View.VISIBLE
                      );

                      overlayHidden =
                              false;
                  }
              }

              private void showKeyboard() {

                  if (
                      inputBox == null ||
                      overlayHidden
                  ) {

                      return;
                  }

                  inputBox.postDelayed(
                          () -> {

                              try {

                                  if (
                                      overlayHidden
                                  ) {

                                      return;
                                  }

                                  inputBox.setFocusable(
                                          true
                                  );

                                  inputBox.setFocusableInTouchMode(
                                          true
                                  );

                                  inputBox.requestFocus();

                                  inputBox.setSelection(
                                          inputBox
                                                  .getText()
                                                  .length()
                                  );

                                  InputMethodManager imm =
                                          (InputMethodManager)
                                          getSystemService(
                                                  Context.INPUT_METHOD_SERVICE
                                          );

                                  if (
                                      imm != null
                                  ) {

                                      imm.showSoftInput(
                                              inputBox,
                                              InputMethodManager.SHOW_IMPLICIT
                                      );
                                  }

                              } catch (
                                      Exception ignored
                              ) {
                              }

                          },
                          350
                  );
              }

              private void hideKeyboard() {

                  try {

                      InputMethodManager imm =
                              (InputMethodManager)
                              getSystemService(
                                      Context.INPUT_METHOD_SERVICE
                              );

                      if (
                          imm != null &&
                          inputBox != null
                      ) {

                          imm.hideSoftInputFromWindow(
                                  inputBox.getWindowToken(),
                                  0
                          );
                      }

                  } catch (
                          Exception ignored
                  ) {
                  }
              }

              private void saveCurrentInputHistory() {

                  if (
                      inputBox == null
                  ) {

                      return;
                  }

                  String text =
                          inputBox
                                  .getText()
                                  .toString()
                                  .trim();

                  if (
                      !text.isEmpty()
                  ) {

                      HistoryManager.add(
                              this,
                              text,
                              "输入"
                      );
                  }
              }

              private void setupHistory(
                      TextView button
              ) {

                  button.setOnClickListener(
                          v -> {

                      saveCurrentInputHistory();

                      saveSettings();

                      /*
                       * 点击历史以后，
                       * 先隐藏悬浮窗。
                       */
                      hideOverlay();

                      Intent intent =
                              new Intent(
                                      this,
                                      HistoryActivity.class
                              );

                      intent.addFlags(
                              Intent.FLAG_ACTIVITY_NEW_TASK
                      );

                      startActivity(
                              intent
                      );
                  });
              }

              private void setupSettings(
                      TextView button
              ) {

                  button.setOnClickListener(
                          v -> {

                      saveCurrentInputHistory();

                      Intent intent =
                              new Intent(
                                      this,
                                      SettingsActivity.class
                              );

                      intent.addFlags(
                              Intent.FLAG_ACTIVITY_NEW_TASK
                      );

                      startActivity(
                              intent
                      );
                  });
              }

              private void setupClose(
                      TextView button
              ) {

                  button.setOnClickListener(
                          v -> closeEntireApp()
                  );
              }

              /*
               * ==============================
               * 智能打开
               * ==============================
               *
               * 是网址：
               * 直接打开网址
               *
               * 非网址：
               * 百度搜索
               */
              private void openOrSearchAndExit() {

                  String text =
                          inputBox
                                  .getText()
                                  .toString()
                                  .trim();

                  if (
                      text.isEmpty()
                  ) {

                      Toast.makeText(
                              this,
                              "请输入网址或搜索内容",
                              Toast.LENGTH_SHORT
                      ).show();

                      return;
                  }

                  /*
                   * 如果包含多行，
                   * 搜索第一行。
                   */
                  if (
                      text.contains(
                              "\n"
                      )
                  ) {

                      text =
                              text.split(
                                      "\n"
                              )[0]
                              .trim();
                  }

                  if (
                      text.isEmpty()
                  ) {

                      Toast.makeText(
                              this,
                              "请输入网址或搜索内容",
                              Toast.LENGTH_SHORT
                      ).show();

                      return;
                  }

                  String lower =
                          text.toLowerCase();

                  boolean hasHttp =
                          lower.startsWith(
                                  "http://"
                          ) ||
                          lower.startsWith(
                                  "https://"
                          );

                  String checkText =
                          lower.replaceFirst(
                                  "^https?://",
                                  ""
                          );

                  String hostPart =
                          checkText;

                  int slashIndex =
                          hostPart.indexOf(
                                  "/"
                          );

                  if (
                      slashIndex >= 0
                  ) {

                      hostPart =
                              hostPart.substring(
                                      0,
                                      slashIndex
                              );
                  }

                  boolean looksLikeUrl =
                          hasHttp ||
                          (
                              hostPart.contains(
                                      "."
                              ) &&
                              !hostPart.contains(
                                      " "
                              ) &&
                              !hostPart.contains(
                                      "。"
                              )
                          );

                  String finalUrl;

                  if (
                      looksLikeUrl
                  ) {

                      /*
                       * 是网址。
                       */
                      if (
                          hasHttp
                      ) {

                          finalUrl =
                                  text;

                      } else {

                          finalUrl =
                                  "https://" +
                                  text;
                      }

                      HistoryManager.add(
                              this,
                              text,
                              "打开网址"
                      );

                  } else {

                      /*
                       * 非网址：
                       * 百度搜索。
                       */
                      try {

                          String encoded =
                                  URLEncoder.encode(
                                          text,
                                          "UTF-8"
                                  );

                          finalUrl =
                                  "https://www.baidu.com/s?wd=" +
                                  encoded;

                      } catch (
                              Exception e
                      ) {

                          Toast.makeText(
                                  this,
                                  "搜索内容处理失败",
                                  Toast.LENGTH_SHORT
                          ).show();

                          return;
                      }

                      HistoryManager.add(
                              this,
                              text,
                              "百度搜索"
                      );
                  }

                  try {

                      Uri uri =
                              Uri.parse(
                                      finalUrl
                              );

                      Intent browser =
                              new Intent(
                                      Intent.ACTION_VIEW,
                                      uri
                              );

                      browser.addFlags(
                              Intent.FLAG_ACTIVITY_NEW_TASK
                      );

                      startActivity(
                              browser
                      );

                      saveSettings();

                      /*
                       * 下次重新打开APP，
                       * 透明度重新从90%开始。
                       */
                      prefs.edit()
                              .putInt(
                                      "alpha_percent",
                                      90
                              )
                              .apply();

                      hideKeyboard();

                      closeAppTasks();

                      stopSelf();

                  } catch (
                          Exception e
                  ) {

                      Toast.makeText(
                              this,
                              "无法打开网页",
                              Toast.LENGTH_SHORT
                      ).show();
                  }
              }

              private void closeEntireApp() {

                  saveCurrentInputHistory();

                  saveSettings();

                  /*
                   * 下次打开：
                   * 默认90%。
                   */
                  prefs.edit()
                          .putInt(
                                  "alpha_percent",
                                  90
                          )
                          .apply();

                  hideKeyboard();

                  closeAppTasks();

                  stopSelf();
              }

              private void closeAppTasks() {

                  try {

                      ActivityManager manager =
                              (ActivityManager)
                              getSystemService(
                                      Context.ACTIVITY_SERVICE
                              );

                      if (
                          manager != null
                      ) {

                          for (
                              ActivityManager.AppTask task :
                              manager.getAppTasks()
                          ) {

                              task.finishAndRemoveTask();
                          }
                      }

                  } catch (
                          Exception ignored
                  ) {
                  }
              }

              /*
               * ==============================
               * 移动悬浮窗
               * ==============================
               */
              private void setupMove() {

                  moveHandle.setOnTouchListener(
                          (view, event) -> {

                      switch (
                              event.getActionMasked()
                      ) {

                          case MotionEvent.ACTION_DOWN:

                              moveDownRawX =
                                      event.getRawX();

                              moveDownRawY =
                                      event.getRawY();

                              moveStartX =
                                      params.x;

                              moveStartY =
                                      params.y;

                              return true;

                          case MotionEvent.ACTION_MOVE:

                              params.x =
                                      moveStartX +
                                      (int) (
                                          event.getRawX() -
                                          moveDownRawX
                                      );

                              params.y =
                                      moveStartY +
                                      (int) (
                                          event.getRawY() -
                                          moveDownRawY
                                      );

                              try {

                                  windowManager.updateViewLayout(
                                          rootView,
                                          params
                                  );

                              } catch (
                                      Exception ignored
                              ) {
                              }

                              return true;

                          case MotionEvent.ACTION_UP:

                          case MotionEvent.ACTION_CANCEL:

                              saveSettings();

                              return true;
                      }

                      return true;
                  });
              }

              /*
               * ==============================
               * 调整大小
               * ==============================
               */
              private void setupResize() {

                  resizeHandle.setOnTouchListener(
                          (view, event) -> {

                      switch (
                              event.getActionMasked()
                      ) {

                          case MotionEvent.ACTION_DOWN:

                              resizeRawX =
                                      event.getRawX();

                              resizeRawY =
                                      event.getRawY();

                              startWidth =
                                      params.width;

                              startHeight =
                                      params.height;

                              resizeMoved =
                                      false;

                              return true;

                          case MotionEvent.ACTION_MOVE:

                              int dx =
                                      (int) (
                                          event.getRawX() -
                                          resizeRawX
                                      );

                              int dy =
                                      (int) (
                                          event.getRawY() -
                                          resizeRawY
                                      );

                              if (
                                  Math.abs(
                                          dx
                                  ) > dp(12) ||
                                  Math.abs(
                                          dy
                                  ) > dp(12)
                              ) {

                                  resizeMoved =
                                          true;
                              }

                              if (
                                  resizeMoved
                              ) {

                                  int screenWidth =
                                          getResources()
                                                  .getDisplayMetrics()
                                                  .widthPixels;

                                  int screenHeight =
                                          getResources()
                                                  .getDisplayMetrics()
                                                  .heightPixels;

                                  params.width =
                                          Math.max(
                                                  dp(250),
                                                  Math.min(
                                                          startWidth + dx,
                                                          screenWidth
                                                  )
                                          );

                                  params.height =
                                          Math.max(
                                                  dp(220),
                                                  Math.min(
                                                          startHeight + dy,
                                                          screenHeight
                                                  )
                                          );

                                  try {

                                      windowManager.updateViewLayout(
                                              rootView,
                                              params
                                      );

                                  } catch (
                                      Exception ignored
                                  ) {
                                  }
                              }

                              return true;

                          case MotionEvent.ACTION_UP:

                              if (
                                  resizeMoved
                              ) {

                                  saveSettings();

                              } else {

                                  insertNewLine();
                              }

                              return true;

                          case MotionEvent.ACTION_CANCEL:

                              if (
                                  resizeMoved
                              ) {

                                  saveSettings();
                              }

                              return true;
                      }

                      return false;
                  });
              }

              /*
               * 单击右下角 ↘：
               * 插入换行。
               */
              private void insertNewLine() {

                  Editable editable =
                          inputBox.getText();

                  int start =
                          inputBox.getSelectionStart();

                  int end =
                          inputBox.getSelectionEnd();

                  if (
                      start < 0
                  ) {

                      start =
                              editable.length();
                  }

                  if (
                      end < 0
                  ) {

                      end =
                              start;
                  }

                  int min =
                          Math.min(
                                  start,
                                  end
                          );

                  int max =
                          Math.max(
                                  start,
                                  end
                          );

                  editable.replace(
                          min,
                          max,
                          "\n"
                  );

                  inputBox.setSelection(
                          Math.min(
                                  min + 1,
                                  editable.length()
                          )
                  );

                  inputBox.requestFocus();

                  showKeyboard();
              }

              /*
               * ==============================
               * 保存设置
               * ==============================
               */
              private void saveSettings() {

                  if (
                      params == null
                  ) {

                      return;
                  }

                  prefs.edit()
                          .putInt(
                                  "x",
                                  params.x
                          )
                          .putInt(
                                  "y",
                                  params.y
                          )
                          .putInt(
                                  "width",
                                  params.width
                          )
                          .putInt(
                                  "height",
                                  params.height
                          )
                          .putInt(
                                  "alpha_percent",
                                  alphaPercent
                          )
                          .putInt(
                                  "font_color_index",
                                  fontColorIndex
                          )
                          .apply();
              }

              @Override
              public void onDestroy() {

                  if (
                      params != null
                  ) {

                      /*
                       * 这里只保存位置、大小、字体颜色。
                       *
                       * 透明度在正常关闭时已经设置为
                       * 下次90%。
                       */
                      prefs.edit()
                              .putInt(
                                      "x",
                                      params.x
                              )
                              .putInt(
                                      "y",
                                      params.y
                              )
                              .putInt(
                                      "width",
                                      params.width
                              )
                              .putInt(
                                      "height",
                                      params.height
                              )
                              .putInt(
                                      "font_color_index",
                                      fontColorIndex
                              )
                              .apply();
                  }

                  hideKeyboard();

                  if (
                      windowManager != null &&
                      rootView != null
                  ) {

                      try {

                          windowManager.removeView(
                                  rootView
                          );

                      } catch (
                                      Exception ignored
                              ) {
                      }
                  }

                  rootView =
                          null;

                  if (
                      Build.VERSION.SDK_INT >=
                      Build.VERSION_CODES.N
                  ) {

                      stopForeground(
                              STOP_FOREGROUND_REMOVE
                      );

                  } else {

                      stopForeground(
                              true
                      );
                  }

                  super.onDestroy();
              }

              @Override
              public IBinder onBind(
                      Intent intent
              ) {

                  return null;
              }
          }
          EOF

      - name: Install Gradle
        shell: bash
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle-8.9-bin.zip
          ./gradle-8.9/bin/gradle wrapper --gradle-version 8.9
          chmod +x gradlew

      - name: Build APK
        shell: bash
        run: |
          ./gradlew assembleDebug

      - name: Prepare APK
        shell: bash
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk FloatingInputApp-V14.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FloatingInputApp-V14-APK
          path: FloatingInputApp-V14.apk
          retention-days: 30
