          package com.jiexin.floatinginput;

          import android.app.Activity;
          import android.content.Intent;
          import android.graphics.Color;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.provider.Settings;
          import android.widget.FrameLayout;
          import android.widget.Toast;

          public class MainActivity extends Activity {

              private boolean permissionRequested =
                      false;

              private boolean started =
                      false;

              @Override
              protected void onCreate(
                      Bundle savedInstanceState
              ) {

                  super.onCreate(
                          savedInstanceState
                  );

                  FrameLayout transparent =
                          new FrameLayout(
                                  this
                          );

                  transparent.setBackgroundColor(
                          Color.TRANSPARENT
                  );

                  setContentView(
                          transparent
                  );

                  /*
                   * V14：
                   * 每次重新打开APP默认90%透明度。
                   */
                  getSharedPreferences(
                          "floating_settings",
                          MODE_PRIVATE
                  )
                  .edit()
                  .putInt(
                          "alpha_percent",
                          90
                  )
                  .apply();

                  openFloatingInput();
              }

              @Override
              protected void onResume() {

                  super.onResume();

                  if (
                      permissionRequested &&
                      Settings.canDrawOverlays(
                              this
                      )
                  ) {

                      permissionRequested =
                              false;

                      startOverlay();
                  }
              }

              private void openFloatingInput() {

                  if (
                      Settings.canDrawOverlays(
                              this
                      )
                  ) {

                      startOverlay();

                  } else {

                      permissionRequested =
                              true;

                      Toast.makeText(
                              this,
                              "第一次使用，请开启“显示在其他应用上层”权限",
                              Toast.LENGTH_LONG
                      ).show();

                      Intent intent =
                              new Intent(
                                      Settings.ACTION_MANAGE_OVERLAY_PERMISSION,
                                      Uri.parse(
                                              "package:" +
                                              getPackageName()
                                      )
                              );

                      startActivity(
                              intent
                      );
                  }
              }

              private void startOverlay() {

                  if (
                      started
                  ) {

                      return;
                  }

                  started =
                          true;

                  Intent serviceIntent =
                          new Intent(
                                  this,
                                  FloatingService.class
                          );

                  serviceIntent.setAction(
                          "OPEN_AND_KEYBOARD"
                  );

                  if (
                      Build.VERSION.SDK_INT >=
                      Build.VERSION_CODES.O
                  ) {

                      startForegroundService(
                              serviceIntent
                      );

                  } else {

                      startService(
                              serviceIntent
                      );
                  }

                  Intent backIntent =
                          new Intent(
                                  this,
                                  BackCatcherActivity.class
                          );

                  startActivity(
                          backIntent
                  );

                  finish();
              }
          }
          EOF

