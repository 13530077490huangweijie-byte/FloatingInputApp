          package com.jiexin.floatinginput;

          import android.app.Activity;
          import android.content.Intent;
          import android.graphics.Color;
          import android.os.Bundle;
          import android.view.View;
          import android.view.WindowManager;
          import android.widget.FrameLayout;

          public class BackCatcherActivity extends Activity {

              private long firstBackTime = 0;

              @Override
              protected void onCreate(
                      Bundle savedInstanceState
              ) {

                  super.onCreate(
                          savedInstanceState
                  );

                  /*
                   * 透明 Activity。
                   * 用户看不到页面，
                   * 主要负责接收系统返回键。
                   */
                  getWindow().setDimAmount(0f);

                  getWindow().setSoftInputMode(
                          WindowManager.LayoutParams
                                  .SOFT_INPUT_ADJUST_NOTHING
                  );

                  FrameLayout invisible =
                          new FrameLayout(this);

                  invisible.setBackgroundColor(
                          Color.TRANSPARENT
                  );

                  invisible.setVisibility(
                          View.VISIBLE
                  );

                  setContentView(invisible);
              }

              @Override
              public void onBackPressed() {

                  long now =
                          System.currentTimeMillis();

                  /*
                   * 两次返回需要在2秒内完成。
                   */
                  if (
                      firstBackTime == 0 ||
                      now - firstBackTime > 2000
                  ) {

                      firstBackTime = now;

                      /*
                       * 第一次返回：
                       * 通知悬浮服务收起输入法。
                       */
                      Intent intent =
                              new Intent(
                                      this,
                                      FloatingService.class
                              );

                      intent.setAction(
                              "FIRST_BACK"
                      );

                      startService(intent);

                      return;
                  }

                  /*
                   * 第二次返回：
                   * 通知服务彻底关闭悬浮窗程序。
                   */
                  Intent intent =
                          new Intent(
                                  this,
                                  FloatingService.class
                          );

                  intent.setAction(
                          "DOUBLE_BACK_CLOSE"
                  );

                  startService(intent);

                  finishAndRemoveTask();
              }
          }
          EOF

