name: Build Floating Input APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Create Android Project
        shell: bash
        run: |
          mkdir -p app/src/main/java/com/jiexin/floatinginput
          mkdir -p app/src/main/res/values

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "FloatingInputApp"
          include ":app"
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.jiexin.floatinginput'
              compileSdk 35

              defaultConfig {
                  applicationId "com.jiexin.floatinginput"
                  minSdk 23
                  targetSdk 35
                  versionCode 2
                  versionName "2.0"
              }
          }
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#3F51B5</item>
                  <item name="android:windowLightStatusBar">true</item>
                  <item name="android:statusBarColor">#FFFFFF</item>
                  <item name="android:navigationBarColor">#FFFFFF</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />

              <application
                  android:allowBackup="false"
                  android:label="悬浮输入框"
                  android:theme="@style/AppTheme"
                  android:supportsRtl="true">

                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="portrait"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

                  <service
                      android:name=".FloatingService"
                      android:exported="false"
                      android:foregroundServiceType="specialUse">

                      <property
                          android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE"
                          android:value="User controlled floating text input overlay" />
                  </service>

              </application>

          </manifest>
          EOF

          cat > app/src/main/java/com/jiexin/floatinginput/MainActivity.java <<'EOF'
          package com.jiexin.floatinginput;

          import android.app.Activity;
          import android.content.Intent;
          import android.graphics.Color;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.provider.Settings;
          import android.view.ViewGroup;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.TextView;
          import android.widget.Toast;

          public class MainActivity extends Activity {

              private int dp(int value) {
                  return (int) (value * getResources().getDisplayMetrics().density);
              }

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(dp(22), dp(35), dp(22), dp(25));
                  root.setBackgroundColor(Color.rgb(245, 247, 250));

                  TextView title = new TextView(this);
                  title.setText("悬浮输入框");
                  title.setTextSize(28);
                  title.setTextColor(Color.rgb(25, 35, 50));
                  title.setPadding(0, 0, 0, dp(15));
                  root.addView(title);

                  TextView info = new TextView(this);
                  info.setText(
                          "使用方法：\n\n" +
                          "① 开启悬浮窗权限\n" +
                          "② 点击显示悬浮输入框\n" +
                          "③ 点击输入框即可呼出输入法\n" +
                          "④ 长按输入框约0.5秒并拖动可移动位置\n" +
                          "⑤ 拖动右下角 ↘ 可自由调节宽度和高度\n" +
                          "⑥ 点击 − / + 调节整体透明度\n\n" +
                          "透明度：90%、70%、50%、40%、30%、20%"
                  );
                  info.setTextSize(17);
                  info.setTextColor(Color.DKGRAY);
                  info.setPadding(0, 0, 0, dp(20));
                  root.addView(info);

                  Button permission = new Button(this);
                  permission.setText("① 开启悬浮窗权限");
                  permission.setAllCaps(false);

                  permission.setOnClickListener(v -> {
                      Intent intent = new Intent(
                              Settings.ACTION_MANAGE_OVERLAY_PERMISSION,
                              Uri.parse("package:" + getPackageName())
                      );
                      startActivity(intent);
                  });

                  addButton(root, permission);

                  Button show = new Button(this);
                  show.setText("② 显示悬浮输入框");
                  show.setAllCaps(false);

                  show.setOnClickListener(v -> {

                      if (!Settings.canDrawOverlays(this)) {
                          Toast.makeText(
                                  this,
                                  "请先开启悬浮窗权限",
                                  Toast.LENGTH_SHORT
                          ).show();

                          Intent permissionIntent = new Intent(
                                  Settings.ACTION_MANAGE_OVERLAY_PERMISSION,
                                  Uri.parse("package:" + getPackageName())
                          );
                          startActivity(permissionIntent);
                          return;
                      }

                      Intent serviceIntent =
                              new Intent(this, FloatingService.class);

                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          startForegroundService(serviceIntent);
                      } else {
                          startService(serviceIntent);
                      }

                      Toast.makeText(
                              this,
                              "悬浮输入框已显示",
                              Toast.LENGTH_SHORT
                      ).show();
                  });

                  addButton(root, show);

                  Button close = new Button(this);
                  close.setText("关闭悬浮输入框");
                  close.setAllCaps(false);

                  close.setOnClickListener(v ->
                          stopService(
                                  new Intent(this, FloatingService.class)
                          )
                  );

                  addButton(root, close);

                  setContentView(root);
              }

              private void addButton(
                      LinearLayout root,
                      Button button
              ) {
                  LinearLayout.LayoutParams lp =
                          new LinearLayout.LayoutParams(
                                  ViewGroup.LayoutParams.MATCH_PARENT,
                                  dp(58)
                          );

                  lp.bottomMargin = dp(12);
                  root.addView(button, lp);
              }
          }
          EOF

          cat > app/src/main/java/com/jiexin/floatinginput/FloatingService.java <<'EOF'
          package com.jiexin.floatinginput;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.app.Service;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.graphics.Color;
          import android.graphics.PixelFormat;
          import android.graphics.drawable.GradientDrawable;
          import android.os.Build;
          import android.os.IBinder;
          import android.os.SystemClock;
          import android.view.Gravity;
          import android.view.MotionEvent;
          import android.view.ViewConfiguration;
          import android.view.ViewGroup;
          import android.view.WindowManager;
          import android.view.inputmethod.InputMethodManager;
          import android.widget.Button;
          import android.widget.EditText;
          import android.widget.FrameLayout;
          import android.widget.LinearLayout;
          import android.widget.TextView;

          public class FloatingService extends Service {

              private static final String CHANNEL_ID =
                      "floating_input_channel";

              private static final int NOTIFICATION_ID = 1001;

              private WindowManager windowManager;
              private LinearLayout rootView;
              private EditText inputBox;
              private TextView alphaText;
              private TextView resizeHandle;
              private WindowManager.LayoutParams params;

              private SharedPreferences prefs;

              private final float[] alphaLevels = {
                      0.90f,
                      0.70f,
                      0.50f,
                      0.40f,
                      0.30f,
                      0.20f
              };

              private final String[] alphaLabels = {
                      "90%",
                      "70%",
                      "50%",
                      "40%",
                      "30%",
                      "20%"
              };

              private int alphaIndex = 0;

              private float downRawX;
              private float downRawY;

              private int startX;
              private int startY;

              private long downTime;
              private boolean moving = false;

              private float resizeRawX;
              private float resizeRawY;

              private int startWidth;
              private int startHeight;

              private int dp(int value) {
                  return (int) (
                          value *
                          getResources().getDisplayMetrics().density
                  );
              }

              @Override
              public void onCreate() {
                  super.onCreate();

                  prefs = getSharedPreferences(
                          "floating_settings",
                          MODE_PRIVATE
                  );

                  createNotificationChannel();

                  startForeground(
                          NOTIFICATION_ID,
                          createNotification()
                  );

                  windowManager =
                          (WindowManager)
                          getSystemService(WINDOW_SERVICE);

                  createFloatingWindow();
              }

              private void createNotificationChannel() {

                  if (Build.VERSION.SDK_INT >=
                          Build.VERSION_CODES.O) {

                      NotificationChannel channel =
                              new NotificationChannel(
                                      CHANNEL_ID,
                                      "悬浮输入框",
                                      NotificationManager.IMPORTANCE_LOW
                              );

                      channel.setDescription(
                              "保持悬浮输入框运行"
                      );

                      channel.setShowBadge(false);

                      NotificationManager manager =
                              getSystemService(
                                      NotificationManager.class
                              );

                      manager.createNotificationChannel(channel);
                  }
              }

              private Notification createNotification() {

                  Intent intent =
                          new Intent(this, MainActivity.class);

                  PendingIntent pendingIntent =
                          PendingIntent.getActivity(
                                  this,
                                  0,
                                  intent,
                                  PendingIntent.FLAG_UPDATE_CURRENT |
                                  PendingIntent.FLAG_IMMUTABLE
                          );

                  Notification.Builder builder;

                  if (Build.VERSION.SDK_INT >=
                          Build.VERSION_CODES.O) {

                      builder =
                              new Notification.Builder(
                                      this,
                                      CHANNEL_ID
                              );

                  } else {

                      builder =
                              new Notification.Builder(this);
                  }

                  return builder
                          .setContentTitle(
                                  "悬浮输入框正在运行"
                          )
                          .setContentText(
                                  "点击返回设置"
                          )
                          .setSmallIcon(
                                  android.R.drawable.ic_menu_edit
                          )
                          .setContentIntent(pendingIntent)
                          .setOngoing(true)
                          .build();
              }

              private GradientDrawable background(
                      int color,
                      int radius,
                      Integer strokeColor
              ) {

                  GradientDrawable drawable =
                          new GradientDrawable();

                  drawable.setColor(color);
                  drawable.setCornerRadius(dp(radius));

                  if (strokeColor != null) {
                      drawable.setStroke(
                              dp(1),
                              strokeColor
                      );
                  }

                  return drawable;
              }

              private void createFloatingWindow() {

                  rootView =
                          new LinearLayout(this);

                  rootView.setOrientation(
                          LinearLayout.VERTICAL
                  );

                  rootView.setPadding(
                          dp(8),
                          dp(8),
                          dp(8),
                          dp(8)
                  );

                  rootView.setBackground(
                          background(
                                  Color.WHITE,
                                  12,
                                  Color.rgb(90, 90, 90)
                          )
                  );

                  FrameLayout inputFrame =
                          new FrameLayout(this);

                  inputBox =
                          new EditText(this);

                  inputBox.setHint(
                          "点击这里输入文字"
                  );

                  inputBox.setTextSize(18);
                  inputBox.setGravity(
                          Gravity.TOP |
                          Gravity.START
                  );

                  inputBox.setTextColor(
                          Color.BLACK
                  );

                  inputBox.setHintTextColor(
                          Color.GRAY
                  );

                  inputBox.setSingleLine(false);
                  inputBox.setMinLines(2);

                  inputBox.setPadding(
                          dp(12),
                          dp(10),
                          dp(48),
                          dp(45)
                  );

                  inputBox.setBackground(
                          background(
                                  Color.WHITE,
                                  8,
                                  Color.LTGRAY
                          )
                  );

                  FrameLayout.LayoutParams inputLp =
                          new FrameLayout.LayoutParams(
                                  ViewGroup.LayoutParams.MATCH_PARENT,
                                  ViewGroup.LayoutParams.MATCH_PARENT
                          );

                  inputFrame.addView(
                          inputBox,
                          inputLp
                  );

                  resizeHandle =
                          new TextView(this);

                  resizeHandle.setText("↘");
                  resizeHandle.setTextSize(27);
                  resizeHandle.setGravity(
                          Gravity.CENTER
                  );

                  resizeHandle.setTextColor(
                          Color.rgb(
                                  40,
                                  90,
                                  190
                          )
                  );

                  resizeHandle.setBackground(
                          background(
                                  Color.argb(
                                          60,
                                          80,
                                          120,
                                          220
                                  ),
                                  8,
                                  null
                          )
                  );

                  FrameLayout.LayoutParams resizeLp =
                          new FrameLayout.LayoutParams(
                                  dp(44),
                                  dp(44),
                                  Gravity.BOTTOM |
                                  Gravity.END
                          );

                  inputFrame.addView(
                          resizeHandle,
                          resizeLp
                  );

                  LinearLayout controls =
                          new LinearLayout(this);

                  controls.setOrientation(
                          LinearLayout.HORIZONTAL
                  );

                  controls.setGravity(
                          Gravity.CENTER_VERTICAL
                  );

                  controls.setPadding(
                          0,
                          dp(5),
                          0,
                          0
                  );

                  Button minus =
                          new Button(this);

                  minus.setText("−");
                  minus.setTextSize(23);
                  minus.setAllCaps(false);
                  minus.setPadding(0, 0, 0, 0);

                  Button plus =
                          new Button(this);

                  plus.setText("+");
                  plus.setTextSize(23);
                  plus.setAllCaps(false);
                  plus.setPadding(0, 0, 0, 0);

                  alphaText =
                          new TextView(this);

                  alphaText.setTextSize(16);
                  alphaText.setGravity(
                          Gravity.CENTER
                  );

                  alphaText.setTextColor(
                          Color.DKGRAY
                  );

                  minus.setOnClickListener(v -> {

                      if (
                          alphaIndex <
                          alphaLevels.length - 1
                      ) {
                          alphaIndex++;
                          updateAlpha();
                          saveSettings();
                      }
                  });

                  plus.setOnClickListener(v -> {

                      if (alphaIndex > 0) {
                          alphaIndex--;
                          updateAlpha();
                          saveSettings();
                      }
                  });

                  controls.addView(
                          minus,
                          new LinearLayout.LayoutParams(
                                  dp(65),
                                  dp(50)
                          )
                  );

                  controls.addView(
                          alphaText,
                          new LinearLayout.LayoutParams(
                                  0,
                                  dp(50),
                                  1f
                          )
                  );

                  controls.addView(
                          plus,
                          new LinearLayout.LayoutParams(
                                  dp(65),
                                  dp(50)
                          )
                  );

                  rootView.addView(
                          inputFrame,
                          new LinearLayout.LayoutParams(
                                  ViewGroup.LayoutParams.MATCH_PARENT,
                                  0,
                                  1f
                          )
                  );

                  rootView.addView(
                          controls,
                          new LinearLayout.LayoutParams(
                                  ViewGroup.LayoutParams.MATCH_PARENT,
                                  dp(55)
                          )
                  );

                  int type;

                  if (
                      Build.VERSION.SDK_INT >=
                      Build.VERSION_CODES.O
                  ) {
                      type =
                              WindowManager.LayoutParams
                                      .TYPE_APPLICATION_OVERLAY;
                  } else {
                      type =
                              WindowManager.LayoutParams
                                      .TYPE_PHONE;
                  }

                  int width =
                          prefs.getInt(
                                  "width",
                                  dp(320)
                          );

                  int height =
                          prefs.getInt(
                                  "height",
                                  dp(230)
                          );

                  alphaIndex =
                          prefs.getInt(
                                  "alpha",
                                  0
                          );

                  if (alphaIndex < 0) {
                      alphaIndex = 0;
                  }

                  if (
                      alphaIndex >=
                      alphaLevels.length
                  ) {
                      alphaIndex = 0;
                  }

                  params =
                          new WindowManager.LayoutParams(
                                  width,
                                  height,
                                  type,
                                  WindowManager.LayoutParams
                                          .FLAG_NOT_TOUCH_MODAL |
                                  WindowManager.LayoutParams
                                          .FLAG_LAYOUT_IN_SCREEN,
                                  PixelFormat.TRANSLUCENT
                          );

                  params.gravity =
                          Gravity.TOP |
                          Gravity.START;

                  params.x =
                          prefs.getInt(
                                  "x",
                                  dp(30)
                          );

                  params.y =
                          prefs.getInt(
                                  "y",
                                  dp(120)
                          );

                  params.softInputMode =
                          WindowManager.LayoutParams
                                  .SOFT_INPUT_ADJUST_RESIZE;

                  windowManager.addView(
                          rootView,
                          params
                  );

                  updateAlpha();
                  setupMove();
                  setupResize();
              }

              private void setupMove() {

                  final int touchSlop =
                          ViewConfiguration
                                  .get(this)
                                  .getScaledTouchSlop();

                  inputBox.setOnTouchListener(
                          (view, event) -> {

                      switch (
                              event.getActionMasked()
                      ) {

                          case MotionEvent.ACTION_DOWN:

                              downRawX =
                                      event.getRawX();

                              downRawY =
                                      event.getRawY();

                              startX =
                                      params.x;

                              startY =
                                      params.y;

                              downTime =
                                      SystemClock
                                              .uptimeMillis();

                              moving = false;

                              return false;

                          case MotionEvent.ACTION_MOVE:

                              long elapsed =
                                      SystemClock
                                              .uptimeMillis()
                                      - downTime;

                              float dx =
                                      event.getRawX()
                                      - downRawX;

                              float dy =
                                      event.getRawY()
                                      - downRawY;

                              if (
                                  elapsed >= 500 &&
                                  (
                                      Math.abs(dx) >
                                      touchSlop ||
                                      Math.abs(dy) >
                                      touchSlop
                                  )
                              ) {

                                  moving = true;

                                  inputBox.clearFocus();

                                  params.x =
                                          startX +
                                          (int) dx;

                                  params.y =
                                          startY +
                                          (int) dy;

                                  windowManager
                                          .updateViewLayout(
                                                  rootView,
                                                  params
                                          );

                                  return true;
                              }

                              return false;

                          case MotionEvent.ACTION_UP:

                              if (moving) {

                                  moving = false;
                                  saveSettings();
                                  return true;
                              }

                              inputBox
                                      .requestFocus();

                              InputMethodManager imm =
                                      (InputMethodManager)
                                      getSystemService(
                                              Context
                                                      .INPUT_METHOD_SERVICE
                                      );

                              imm.showSoftInput(
                                      inputBox,
                                      InputMethodManager
                                              .SHOW_IMPLICIT
                              );

                              return false;

                          case MotionEvent.ACTION_CANCEL:

                              moving = false;
                              return false;
                      }

                      return false;
                  });
              }

              private void setupResize() {

                  resizeHandle.setOnTouchListener(
                          (view, event) -> {

                      switch (
                              event.getActionMasked()
                      ) {

                          case MotionEvent.ACTION_DOWN:

                              resizeRawX =
                                      event.getRawX();

                              resizeRawY =
                                      event.getRawY();

                              startWidth =
                                      params.width;

                              startHeight =
                                      params.height;

                              return true;

                          case MotionEvent.ACTION_MOVE:

                              int dx =
                                      (int) (
                                          event.getRawX()
                                          - resizeRawX
                                      );

                              int dy =
                                      (int) (
                                          event.getRawY()
                                          - resizeRawY
                                      );

                              int screenWidth =
                                      getResources()
                                              .getDisplayMetrics()
                                              .widthPixels;

                              int screenHeight =
                                      getResources()
                                              .getDisplayMetrics()
                                              .heightPixels;

                              int newWidth =
                                      startWidth + dx;

                              int newHeight =
                                      startHeight + dy;

                              newWidth =
                                      Math.max(
                                              dp(200),
                                              Math.min(
                                                      newWidth,
                                                      screenWidth
                                              )
                                      );

                              newHeight =
                                      Math.max(
                                              dp(140),
                                              Math.min(
                                                      newHeight,
                                                      screenHeight
                                              )
                                      );

                              params.width =
                                      newWidth;

                              params.height =
                                      newHeight;

                              windowManager
                                      .updateViewLayout(
                                              rootView,
                                              params
                                      );

                              return true;

                          case MotionEvent.ACTION_UP:
                          case MotionEvent.ACTION_CANCEL:

                              saveSettings();
                              return true;
                      }

                      return false;
                  });
              }

              private void updateAlpha() {

                  rootView.setAlpha(
                          alphaLevels[
                                  alphaIndex
                          ]
                  );

                  alphaText.setText(
                          alphaLabels[
                                  alphaIndex
                          ]
                  );
              }

              private void saveSettings() {

                  if (params == null) {
                      return;
                  }

                  prefs.edit()
                          .putInt(
                                  "x",
                                  params.x
                          )
                          .putInt(
                                  "y",
                                  params.y
                          )
                          .putInt(
                                  "width",
                                  params.width
                          )
                          .putInt(
                                  "height",
                                  params.height
                          )
                          .putInt(
                                  "alpha",
                                  alphaIndex
                          )
                          .apply();
              }

              @Override
              public void onDestroy() {

                  saveSettings();

                  if (
                      windowManager != null &&
                      rootView != null
                  ) {

                      try {
                          windowManager
                                  .removeView(
                                          rootView
                                  );
                      } catch (
                              Exception ignored
                      ) {
                      }
                  }

                  if (
                      Build.VERSION.SDK_INT >=
                      Build.VERSION_CODES.N
                  ) {
                      stopForeground(
                              STOP_FOREGROUND_REMOVE
                      );
                  } else {
                      stopForeground(true);
                  }

                  super.onDestroy();
              }

              @Override
              public IBinder onBind(
                      Intent intent
              ) {
                  return null;
              }
          }
          EOF

      - name: Install Gradle
        shell: bash
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle-8.9-bin.zip
          ./gradle-8.9/bin/gradle wrapper --gradle-version 8.9
          chmod +x gradlew

      - name: Build APK
        shell: bash
        run: |
          ./gradlew assembleDebug

      - name: Prepare APK
        shell: bash
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk FloatingInputApp-V2.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FloatingInputApp-V2-APK
          path: FloatingInputApp-V2.apk
          retention-days: 30
