               * 6. 停止悬浮服务
               */
              private void closeEntireApp() {

                  saveCurrentInputHistory();

                  saveSettings();

                  /*
                   * 关键：
                   * 关闭时强制把下次透明度设成90%。
                   */
                  prefs.edit()
                          .putInt(
                                  "alpha",
                                  0
                          )
                          .apply();

                  hideKeyboard();

                  closeAppTasks();

                  stopSelf();
              }

              private void searchAndExit() {

                  String text =
                          inputBox
                                  .getText()
                                  .toString()
                                  .trim();

                  if (
                      text.isEmpty()
                  ) {

                      Toast.makeText(
                              this,
                              "请先输入搜索内容",
                              Toast.LENGTH_SHORT
                      ).show();

                      return;
                  }

                  HistoryManager.add(
                          this,
                          text,
                          "搜索"
                  );

                  try {

                      String encoded =
                              URLEncoder.encode(
                                      text,
                                      "UTF-8"
                              );

                      Uri uri =
                              Uri.parse(
                                      "https://www.google.com/search?q=" +
                                      encoded
                              );

                      Intent browser =
                              new Intent(
                                      Intent.ACTION_VIEW,
                                      uri
                              );

                      browser.addFlags(
                              Intent.FLAG_ACTIVITY_NEW_TASK
                      );

                      startActivity(
                              browser
                      );

                      saveSettings();

                      /*
                       * 搜索完成后，
                       * 下次打开也是90%。
                       */
                      prefs.edit()
                              .putInt(
                                      "alpha",
                                      0
                              )
                              .apply();

                      hideKeyboard();

                      closeAppTasks();

                      stopSelf();

                  } catch (
                          Exception e
                  ) {

                      Toast.makeText(
                              this,
                              "无法打开浏览器",
                              Toast.LENGTH_SHORT
                      ).show();
                  }
              }

              private void closeAppTasks() {

                  try {

                      ActivityManager manager =
                              (ActivityManager)
                              getSystemService(
                                      Context.ACTIVITY_SERVICE
                              );

                      if (
                          manager != null
                      ) {

                          for (
                              ActivityManager.AppTask task :
                              manager.getAppTasks()
                          ) {

                              task.finishAndRemoveTask();
                          }
                      }

                  } catch (
                          Exception ignored
                  ) {
                  }
              }

              private void setupMove() {

                  moveHandle.setOnTouchListener(
                          (view, event) -> {

                      switch (
                              event.getActionMasked()
                      ) {

                          case MotionEvent.ACTION_DOWN:

                              moveDownRawX =
                                      event.getRawX();

                              moveDownRawY =
                                      event.getRawY();

                              moveStartX =
                                      params.x;

                              moveStartY =
                                      params.y;

                              return true;

                          case MotionEvent.ACTION_MOVE:

                              params.x =
                                      moveStartX +
                                      (int) (
                                          event.getRawX() -
                                          moveDownRawX
                                      );

                              params.y =
                                      moveStartY +
                                      (int) (
                                          event.getRawY() -
                                          moveDownRawY
                                      );

                              try {

                                  windowManager
                                          .updateViewLayout(
                                                  rootView,
                                                  params
                                          );

                              } catch (
                                  Exception ignored
                              ) {
                              }

                              return true;

                          case MotionEvent.ACTION_UP:

                          case MotionEvent.ACTION_CANCEL:

                              saveSettings();

                              return true;
                      }

                      return true;
                  });
              }

              private void setupResize() {

                  resizeHandle.setOnTouchListener(
                          (view, event) -> {

                      switch (
                              event.getActionMasked()
                      ) {

                          case MotionEvent.ACTION_DOWN:

                              resizeRawX =
                                      event.getRawX();

                              resizeRawY =
                                      event.getRawY();

                              startWidth =
                                      params.width;

                              startHeight =
                                      params.height;

                              resizeMoved =
                                      false;

                              return true;

                          case MotionEvent.ACTION_MOVE:

                              int dx =
                                      (int) (
                                          event.getRawX() -
                                          resizeRawX
                                      );

                              int dy =
                                      (int) (
                                          event.getRawY() -
                                          resizeRawY
                                      );

                              if (
                                  Math.abs(dx) > dp(12) ||
                                  Math.abs(dy) > dp(12)
                              ) {

                                  resizeMoved =
                                          true;
                              }

                              if (
                                  resizeMoved
                              ) {

                                  int sw =
                                          getResources()
                                                  .getDisplayMetrics()
                                                  .widthPixels;

                                  int sh =
                                          getResources()
                                                  .getDisplayMetrics()
                                                  .heightPixels;

                                  params.width =
                                          Math.max(
                                                  dp(230),
                                                  Math.min(
                                                          startWidth + dx,
                                                          sw
                                                  )
                                          );

                                  params.height =
                                          Math.max(
                                                  dp(210),
                                                  Math.min(
                                                          startHeight + dy,
                                                          sh
                                                  )
                                          );

                                  try {

                                      windowManager
                                              .updateViewLayout(
                                                      rootView,
                                                      params
                                              );

                                  } catch (
                                      Exception ignored
                                  ) {
                                  }
                              }

                              return true;

                          case MotionEvent.ACTION_UP:

                              if (
                                  resizeMoved
                              ) {

                                  saveSettings();

                              } else {

                                  insertNewLine();
                              }

                              return true;

                          case MotionEvent.ACTION_CANCEL:

                              if (
                                  resizeMoved
                              ) {

                                  saveSettings();
                              }

                              return true;
                      }

                      return false;
                  });
              }

              private void insertNewLine() {

                  Editable editable =
                          inputBox.getText();

                  int start =
                          inputBox.getSelectionStart();

                  int end =
                          inputBox.getSelectionEnd();

                  if (
                      start < 0
                  ) {

                      start =
                              editable.length();
                  }

                  if (
                      end < 0
                  ) {

                      end =
                              start;
                  }

                  int min =
                          Math.min(
                                  start,
                                  end
                          );

                  int max =
                          Math.max(
                                  start,
                                  end
                          );

                  editable.replace(
                          min,
                          max,
                          "\n"
                  );

                  inputBox.setSelection(
                          Math.min(
                                  min + 1,
                                  editable.length()
                          )
                  );

                  inputBox.requestFocus();

                  showKeyboard();
              }

              private void updateAlpha() {

                  if (
                      rootView == null
                  ) {
                      return;
                  }

                  rootView.setAlpha(
                          alphaLevels[
                                  alphaIndex
                          ]
                  );

                  alphaText.setText(
                          alphaLabels[
                                  alphaIndex
                          ]
                  );
              }

              private void saveSettings() {

                  if (
                      params == null
                  ) {
                      return;
                  }

                  prefs.edit()
                          .putInt(
                                  "x",
                                  params.x
                          )
                          .putInt(
                                  "y",
                                  params.y
                          )
                          .putInt(
                                  "width",
                                  params.width
                          )
                          .putInt(
                                  "height",
                                  params.height
                          )
                          .putInt(
                                  "alpha",
                                  alphaIndex
                          )
                          .apply();
              }

              @Override
              public void onDestroy() {

                  /*
                   * 注意：
                   * 这里保存位置和大小，
                   * 但不再覆盖关闭时设定的90%透明度。
                   */

                  if (
                      params != null
                  ) {

                      prefs.edit()
                              .putInt(
                                      "x",
                                      params.x
                              )
                              .putInt(
                                      "y",
                                      params.y
                              )
                              .putInt(
                                      "width",
                                      params.width
                              )
                              .putInt(
                                      "height",
                                      params.height
                              )
                              .apply();
                  }

                  hideKeyboard();

                  if (
                      windowManager != null &&
                      rootView != null
                  ) {

                      try {

                          windowManager.removeView(
                                  rootView
                          );

                      } catch (
                          Exception ignored
                      ) {
                      }
                  }

                  rootView =
                          null;

                  if (
                      Build.VERSION.SDK_INT >=
                      Build.VERSION_CODES.N
                  ) {

                      stopForeground(
                              STOP_FOREGROUND_REMOVE
                      );

                  } else {

                      stopForeground(
                              true
                      );
                  }

                  super.onDestroy();
              }

              @Override
              public IBinder onBind(
                      Intent intent
              ) {

                  return null;
              }
          }
          EOF

      - name: Install Gradle
        shell: bash
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle-8.9-bin.zip
          ./gradle-8.9/bin/gradle wrapper --gradle-version 8.9
          chmod +x gradlew

      - name: Build APK
        shell: bash
        run: |
          ./gradlew assembleDebug

      - name: Prepare APK
        shell: bash
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk FloatingInputApp-V9.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FloatingInputApp-V9-APK
          path: FloatingInputApp-V9.apk
          retention-days: 30
