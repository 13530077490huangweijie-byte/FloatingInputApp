name: Build Floating Input APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Create Android project
        shell: bash
        run: |
          mkdir -p app/src/main/java/com/example/floatinginput
          mkdir -p app/src/main/res/values

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "FloatingInputApp"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
              id 'org.jetbrains.kotlin.android' version '2.0.21' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.example.floatinginput'
              compileSdk 35

              defaultConfig {
                  applicationId "com.example.floatinginput"
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName "1.0"
              }
          }
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#3F51B5</item>
                  <item name="android:windowLightStatusBar">true</item>
                  <item name="android:statusBarColor">#FFFFFF</item>
                  <item name="android:navigationBarColor">#FFFFFF</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />

              <application
                  android:allowBackup="false"
                  android:label="悬浮输入框"
                  android:theme="@style/AppTheme"
                  android:supportsRtl="true">

                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="portrait"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

                  <service
                      android:name=".FloatingInputService"
                      android:exported="false"
                      android:foregroundServiceType="specialUse">

                      <property
                          android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE"
                          android:value="Persistent floating text input overlay controlled by the user" />

                  </service>

              </application>

          </manifest>
          EOF

          cat > app/src/main/java/com/example/floatinginput/MainActivity.kt <<'EOF'
          package com.example.floatinginput

          import android.app.Activity
          import android.content.Intent
          import android.graphics.Color
          import android.graphics.drawable.GradientDrawable
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.provider.Settings
          import android.view.Gravity
          import android.view.ViewGroup
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.TextView
          import android.widget.Toast

          class MainActivity : Activity() {

              private fun dp(value: Int): Int {
                  return (value * resources.displayMetrics.density).toInt()
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  val main = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(dp(22), dp(35), dp(22), dp(25))
                      setBackgroundColor(Color.rgb(245, 247, 250))
                  }

                  val title = TextView(this).apply {
                      text = "悬浮输入框"
                      textSize = 28f
                      setTextColor(Color.rgb(25, 35, 50))
                      setPadding(0, 0, 0, dp(12))
                  }

                  val info = TextView(this).apply {
                      text =
                          "使用说明：\n\n" +
                          "① 开启“显示在其他应用上层”权限\n" +
                          "② 点击“显示悬浮输入框”\n" +
                          "③ 点击输入框即可输入文字\n" +
                          "④ 长按输入框约0.5秒后拖动，可以移动位置\n" +
                          "⑤ 拖动右下角 ↘ 可以自由改变大小\n" +
                          "⑥ 下方 − / + 调节整体透明度\n\n" +
                          "透明度共6档：90%、70%、50%、40%、30%、20%"
                      textSize = 17f
                      setTextColor(Color.DKGRAY)
                      setLineSpacing(0f, 1.2f)
                      setPadding(0, 0, 0, dp(22))
                  }

                  fun makeButton(textValue: String): Button {
                      return Button(this).apply {
                          text = textValue
                          textSize = 17f
                          isAllCaps = false
                      }
                  }

                  val permissionButton = makeButton("① 开启悬浮窗权限").apply {
                      setOnClickListener {
                          val intent = Intent(
                              Settings.ACTION_MANAGE_OVERLAY_PERMISSION,
                              Uri.parse("package:$packageName")
                          )
                          startActivity(intent)
                      }
                  }

                  val showButton = makeButton("② 显示悬浮输入框").apply {
                      setOnClickListener {
                          if (!Settings.canDrawOverlays(this@MainActivity)) {
                              Toast.makeText(
                                  this@MainActivity,
                                  "请先开启悬浮窗权限",
                                  Toast.LENGTH_SHORT
                              ).show()

                              startActivity(
                                  Intent(
                                      Settings.ACTION_MANAGE_OVERLAY_PERMISSION,
                                      Uri.parse("package:$packageName")
                                  )
                              )
                              return@setOnClickListener
                          }

                          val intent = Intent(
                              this@MainActivity,
                              FloatingInputService::class.java
                          )

                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                              startForegroundService(intent)
                          } else {
                              startService(intent)
                          }

                          Toast.makeText(
                              this@MainActivity,
                              "悬浮输入框已显示",
                              Toast.LENGTH_SHORT
                          ).show()
                      }
                  }

                  val closeButton = makeButton("关闭悬浮输入框").apply {
                      setOnClickListener {
                          stopService(
                              Intent(
                                  this@MainActivity,
                                  FloatingInputService::class.java
                              )
                          )
                      }
                  }

                  val buttonParams = LinearLayout.LayoutParams(
                      ViewGroup.LayoutParams.MATCH_PARENT,
                      dp(58)
                  ).apply {
                      bottomMargin = dp(12)
                  }

                  main.addView(title)
                  main.addView(info)
                  main.addView(permissionButton, buttonParams)
                  main.addView(showButton, buttonParams)
                  main.addView(closeButton, buttonParams)

                  setContentView(main)
              }
          }
          EOF

          cat > app/src/main/java/com/example/floatinginput/FloatingInputService.kt <<'EOF'
          package com.example.floatinginput

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.app.Service
          import android.content.Context
          import android.content.Intent
          import android.graphics.Color
          import android.graphics.PixelFormat
          import android.graphics.drawable.GradientDrawable
          import android.os.Build
          import android.os.IBinder
          import android.os.SystemClock
          import android.view.Gravity
          import android.view.MotionEvent
          import android.view.View
          import android.view.ViewConfiguration
          import android.view.ViewGroup
          import android.view.WindowManager
          import android.view.inputmethod.InputMethodManager
          import android.widget.Button
          import android.widget.EditText
          import android.widget.FrameLayout
          import android.widget.LinearLayout
          import android.widget.TextView
          import kotlin.math.abs

          class FloatingInputService : Service() {

              companion object {
                  private const val CHANNEL_ID = "floating_input_channel"
                  private const val NOTIFICATION_ID = 1001
              }

              private lateinit var windowManager: WindowManager
              private lateinit var rootView: LinearLayout
              private lateinit var inputBox: EditText
              private lateinit var resizeHandle: TextView
              private lateinit var alphaText: TextView
              private lateinit var params: WindowManager.LayoutParams

              private val alphaLevels = floatArrayOf(
                  0.90f,
                  0.70f,
                  0.50f,
                  0.40f,
                  0.30f,
                  0.20f
              )

              private val alphaLabels = arrayOf(
                  "90%",
                  "70%",
                  "50%",
                  "40%",
                  "30%",
                  "20%"
              )

              private var alphaIndex = 0

              private var downRawX = 0f
              private var downRawY = 0f
              private var startWindowX = 0
              private var startWindowY = 0
              private var downTime = 0L
              private var moving = false

              private var resizeRawX = 0f
              private var resizeRawY = 0f
              private var startWidth = 0
              private var startHeight = 0

              private val prefs by lazy {
                  getSharedPreferences("floating_input_settings", MODE_PRIVATE)
              }

              private fun dp(value: Int): Int {
                  return (value * resources.displayMetrics.density).toInt()
              }

              override fun onCreate() {
                  super.onCreate()

                  createNotificationChannel()
                  startForeground(NOTIFICATION_ID, createNotification())

                  windowManager =
                      getSystemService(Context.WINDOW_SERVICE) as WindowManager

                  createFloatingWindow()
              }

              private fun createNotificationChannel() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val channel = NotificationChannel(
                          CHANNEL_ID,
                          "悬浮输入框",
                          NotificationManager.IMPORTANCE_LOW
                      ).apply {
                          description = "保持悬浮输入框运行"
                          setShowBadge(false)
                      }

                      val manager =
                          getSystemService(NotificationManager::class.java)

                      manager.createNotificationChannel(channel)
                  }
              }

              private fun createNotification(): Notification {
                  val intent = Intent(this, MainActivity::class.java)

                  val pendingIntent = PendingIntent.getActivity(
                      this,
                      0,
                      intent,
                      PendingIntent.FLAG_UPDATE_CURRENT or
                          PendingIntent.FLAG_IMMUTABLE
                  )

                  return if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      Notification.Builder(this, CHANNEL_ID)
                          .setContentTitle("悬浮输入框正在运行")
                          .setContentText("点击返回悬浮输入框设置")
                          .setSmallIcon(android.R.drawable.ic_menu_edit)
                          .setContentIntent(pendingIntent)
                          .setOngoing(true)
                          .build()
                  } else {
                      Notification.Builder(this)
                          .setContentTitle("悬浮输入框正在运行")
                          .setContentText("点击返回悬浮输入框设置")
                          .setSmallIcon(android.R.drawable.ic_menu_edit)
                          .setContentIntent(pendingIntent)
                          .setOngoing(true)
                          .build()
                  }
              }

              private fun roundedBackground(
                  color: Int,
                  radiusDp: Int,
                  strokeColor: Int? = null,
                  strokeDp: Int = 1
              ): GradientDrawable {
                  return GradientDrawable().apply {
                      setColor(color)
                      cornerRadius = dp(radiusDp).toFloat()

                      if (strokeColor != null) {
                          setStroke(dp(strokeDp), strokeColor)
                      }
                  }
              }

              private fun createFloatingWindow() {

                  rootView = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(dp(8), dp(8), dp(8), dp(8))
                      background = roundedBackground(
                          Color.WHITE,
                          12,
                          Color.rgb(80, 80, 80),
                          1
                      )
                  }

                  val inputFrame = FrameLayout(this)

                  inputBox = EditText(this).apply {
                      hint = "点击这里输入文字"
                      textSize = 18f
                      gravity = Gravity.TOP or Gravity.START
                      setTextColor(Color.BLACK)
                      setHintTextColor(Color.GRAY)
                      setSingleLine(false)
                      minLines = 2
                      setPadding(
                          dp(12),
                          dp(10),
                          dp(42),
                          dp(12)
                      )

                      background = roundedBackground(
                          Color.WHITE,
                          8,
                          Color.LTGRAY,
                          1
                      )
                  }

                  inputFrame.addView(
                      inputBox,
                      FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.MATCH_PARENT
                      )
                  )

                  resizeHandle = TextView(this).apply {
                      text = "↘"
                      textSize = 26f
                      gravity = Gravity.CENTER
                      setTextColor(Color.rgb(45, 90, 180))
                      background = roundedBackground(
                          Color.argb(45, 80, 120, 220),
                          7
                      )
                  }

                  val resizeParams = FrameLayout.LayoutParams(
                      dp(42),
                      dp(42),
                      Gravity.BOTTOM or Gravity.END
                  )

                  inputFrame.addView(
                      resizeHandle,
                      resizeParams
                  )

                  val controls = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                      setPadding(0, dp(5), 0, 0)
                  }

                  val minusButton = Button(this).apply {
                      text = "−"
                      textSize = 22f
                      isAllCaps = false
                      setPadding(0, 0, 0, 0)

                      setOnClickListener {
                          if (alphaIndex < alphaLevels.lastIndex) {
                              alphaIndex++
                              updateTransparency()
                              saveSettings()
                          }
                      }
                  }

                  alphaText = TextView(this).apply {
                      textSize = 16f
                      gravity = Gravity.CENTER
                      setTextColor(Color.DKGRAY)
                  }

                  val plusButton = Button(this).apply {
                      text = "+"
                      textSize = 22f
                      isAllCaps = false
                      setPadding(0, 0, 0, 0)

                      setOnClickListener {
                          if (alphaIndex > 0) {
                              alphaIndex--
                              updateTransparency()
                              saveSettings()
                          }
                      }
                  }

                  controls.addView(
                      minusButton,
                      LinearLayout.LayoutParams(
                          dp(65),
                          dp(50)
                      )
                  )

                  controls.addView(
                      alphaText,
                      LinearLayout.LayoutParams(
                          0,
                          dp(50),
                          1f
                      )
                  )

                  controls.addView(
                      plusButton,
                      LinearLayout.LayoutParams(
                          dp(65),
                          dp(50)
                      )
                  )

                  rootView.addView(
                      inputFrame,
                      LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          0,
                          1f
                      )
                  )

                  rootView.addView(
                      controls,
                      LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          dp(55)
                      )
                  )

                  val windowType =
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY
                      } else {
                          @Suppress("DEPRECATION")
                          WindowManager.LayoutParams.TYPE_PHONE
                      }

                  val savedWidth = prefs.getInt(
                      "width",
                      dp(320)
                  )

                  val savedHeight = prefs.getInt(
                      "height",
                      dp(230)
                  )

                  alphaIndex = prefs.getInt(
                      "alpha_index",
                      0
                  ).coerceIn(
                      0,
                      alphaLevels.lastIndex
                  )

                  params = WindowManager.LayoutParams(
                      savedWidth,
                      savedHeight,
                      windowType,
                      WindowManager.LayoutParams.FLAG_NOT_TOUCH_MODAL or
                          WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN,
                      PixelFormat.TRANSLUCENT
                  ).apply {
                      gravity = Gravity.TOP or Gravity.START
                      x = prefs.getInt("x", dp(30))
                      y = prefs.getInt("y", dp(120))
                      softInputMode =
                          WindowManager.LayoutParams.SOFT_INPUT_ADJUST_RESIZE
                  }

                  windowManager.addView(
                      rootView,
                      params
                  )

                  updateTransparency()
                  setupInputBehaviour()
                  setupResizeBehaviour()
              }

              private fun setupInputBehaviour() {

                  val touchSlop =
                      ViewConfiguration.get(this).scaledTouchSlop

                  inputBox.setOnTouchListener { view, event ->

                      when (event.actionMasked) {

                          MotionEvent.ACTION_DOWN -> {
                              downRawX = event.rawX
                              downRawY = event.rawY

                              startWindowX = params.x
                              startWindowY = params.y

                              downTime = SystemClock.uptimeMillis()
                              moving = false

                              false
                          }

                          MotionEvent.ACTION_MOVE -> {

                              val elapsed =
                                  SystemClock.uptimeMillis() - downTime

                              val dx =
                                  event.rawX - downRawX

                              val dy =
                                  event.rawY - downRawY

                              if (
                                  elapsed >= 500 &&
                                  (
                                      abs(dx) > touchSlop ||
                                      abs(dy) > touchSlop
                                  )
                              ) {
                                  moving = true

                                  inputBox.clearFocus()

                                  params.x =
                                      startWindowX + dx.toInt()

                                  params.y =
                                      startWindowY + dy.toInt()

                                  windowManager.updateViewLayout(
                                      rootView,
                                      params
                                  )

                                  true
                              } else {
                                  false
                              }
                          }

                          MotionEvent.ACTION_UP -> {

                              if (moving) {
                                  moving = false
                                  saveSettings()
                                  true
                              } else {
                                  view.performClick()

                                  inputBox.isFocusableInTouchMode = true
                                  inputBox.requestFocus()

                                  val imm =
                                      getSystemService(
                                          Context.INPUT_METHOD_SERVICE
                                      ) as InputMethodManager

                                  imm.showSoftInput(
                                      inputBox,
                                      InputMethodManager.SHOW_IMPLICIT
                                  )

                                  false
                              }
                          }

                          MotionEvent.ACTION_CANCEL -> {
                              moving = false
                              false
                          }

                          else -> false
                      }
                  }
              }

              private fun setupResizeBehaviour() {

                  resizeHandle.setOnTouchListener { _, event ->

                      when (event.actionMasked) {

                          MotionEvent.ACTION_DOWN -> {

                              resizeRawX = event.rawX
                              resizeRawY = event.rawY

                              startWidth = params.width
                              startHeight = params.height

                              true
                          }

                          MotionEvent.ACTION_MOVE -> {

                              val dx =
                                  (event.rawX - resizeRawX).toInt()

                              val dy =
                                  (event.rawY - resizeRawY).toInt()

                              val screenWidth =
                                  resources.displayMetrics.widthPixels

                              val screenHeight =
                                  resources.displayMetrics.heightPixels

                              params.width =
                                  (startWidth + dx).coerceIn(
                                      dp(220),
                                      screenWidth
                                  )

                              params.height =
                                  (startHeight + dy).coerceIn(
                                      dp(150),
                                      screenHeight
                                  )

                              windowManager.updateViewLayout(
                                  rootView,
                                  params
                              )

                              true
                          }

                          MotionEvent.ACTION_UP,
                          MotionEvent.ACTION_CANCEL -> {
                              saveSettings()
                              true
                          }

                          else -> false
                      }
                  }
              }

              private fun updateTransparency() {

                  val alpha =
                      alphaLevels[alphaIndex]

                  rootView.alpha = alpha

                  alphaText.text =
                      alphaLabels[alphaIndex]
              }

              private fun saveSettings() {

                  if (!::params.isInitialized) {
                      return
                  }

                  prefs.edit()
                      .putInt("x", params.x)
                      .putInt("y", params.y)
                      .putInt("width", params.width)
                      .putInt("height", params.height)
                      .putInt("alpha_index", alphaIndex)
                      .apply()
              }

              override fun onDestroy() {

                  saveSettings()

                  if (::rootView.isInitialized) {
                      try {
                          windowManager.removeView(rootView)
                      } catch (_: Exception) {
                      }
                  }

                  stopForeground(STOP_FOREGROUND_REMOVE)

                  super.onDestroy()
              }

              override fun onBind(intent: Intent?): IBinder? {
                  return null
              }
          }
          EOF

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Gradle and create wrapper
        shell: bash
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle-8.9-bin.zip
          ./gradle-8.9/bin/gradle wrapper --gradle-version 8.9
          chmod +x gradlew

      - name: Build APK
        shell: bash
        run: |
          ./gradlew assembleDebug --stacktrace

      - name: Rename APK
        shell: bash
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk FloatingInputApp.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FloatingInputApp-APK
          path: FloatingInputApp.apk
          retention-days: 30
