          package com.jiexin.floatinginput;

          import android.content.Context;
          import android.content.SharedPreferences;

          import org.json.JSONArray;
          import org.json.JSONObject;

          import java.util.ArrayList;
          import java.util.List;

          public class HistoryManager {

              public static class Item {

                  public String text;
                  public String type;
                  public long time;

                  public Item(
                          String text,
                          String type,
                          long time
                  ) {
                      this.text = text;
                      this.type = type;
                      this.time = time;
                  }
              }

              private static final String PREF =
                      "history_data";

              private static final String KEY =
                      "items";

              public static synchronized List<Item> load(
                      Context context
              ) {

                  List<Item> result =
                          new ArrayList<>();

                  SharedPreferences prefs =
                          context.getSharedPreferences(
                                  PREF,
                                  Context.MODE_PRIVATE
                          );

                  String raw =
                          prefs.getString(
                                  KEY,
                                  "[]"
                          );

                  try {

                      JSONArray array =
                              new JSONArray(raw);

                      for (
                          int i = 0;
                          i < array.length();
                          i++
                      ) {

                          JSONObject object =
                                  array.getJSONObject(i);

                          result.add(
                                  new Item(
                                          object.optString(
                                                  "text",
                                                  ""
                                          ),
                                          object.optString(
                                                  "type",
                                                  "输入"
                                          ),
                                          object.optLong(
                                                  "time",
                                                  0
                                          )
                                  )
                          );
                      }

                  } catch (Exception ignored) {
                  }

                  return result;
              }

              public static synchronized void save(
                      Context context,
                      List<Item> items
              ) {

                  JSONArray array =
                          new JSONArray();

                  try {

                      for (Item item : items) {

                          JSONObject object =
                                  new JSONObject();

                          object.put(
                                  "text",
                                  item.text
                          );

                          object.put(
                                  "type",
                                  item.type
                          );

                          object.put(
                                  "time",
                                  item.time
                          );

                          array.put(object);
                      }

                  } catch (Exception ignored) {
                  }

                  context
                          .getSharedPreferences(
                                  PREF,
                                  Context.MODE_PRIVATE
                          )
                          .edit()
                          .putString(
                                  KEY,
                                  array.toString()
                          )
                          .apply();
              }

              public static synchronized void add(
                      Context context,
                      String text,
                      String type
              ) {

                  if (text == null) {
                      return;
                  }

                  text = text.trim();

                  if (text.isEmpty()) {
                      return;
                  }

                  List<Item> items =
                          load(context);

                  for (
                      int i = items.size() - 1;
                      i >= 0;
                      i--
                  ) {

                      if (
                          items.get(i)
                                  .text
                                  .equals(text)
                      ) {

                          items.remove(i);
                      }
                  }

                  items.add(
                          0,
                          new Item(
                                  text,
                                  type,
                                  System.currentTimeMillis()
                          )
                  );

                  while (
                      items.size() > 500
                  ) {

                      items.remove(
                              items.size() - 1
                      );
                  }

                  save(
                          context,
                          items
                  );
              }

              public static synchronized void clear(
                      Context context
              ) {

                  context
                          .getSharedPreferences(
                                  PREF,
                                  Context.MODE_PRIVATE
                          )
                          .edit()
                          .remove(KEY)
                          .apply();
              }
          }
          EOF

