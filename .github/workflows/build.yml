          import java.util.ArrayList;

          public class PermissionActivity extends Activity {

              private static final int REQUEST_CODE = 9001;

              private int dp(int value) {

                  return (int) (
                          value *
                          getResources()
                                  .getDisplayMetrics()
                                  .density
                  );
              }

              @Override
              protected void onCreate(
                      Bundle savedInstanceState
              ) {

                  super.onCreate(savedInstanceState);

                  LinearLayout root =
                          new LinearLayout(this);

                  root.setOrientation(
                          LinearLayout.VERTICAL
                  );

                  root.setGravity(
                          Gravity.CENTER
                  );

                  root.setPadding(
                          dp(25),
                          dp(30),
                          dp(25),
                          dp(30)
                  );

                  root.setBackgroundColor(
                          Color.WHITE
                  );

                  TextView title =
                          new TextView(this);

                  title.setText(
                          "首次使用权限"
                  );

                  title.setTextSize(26);

                  title.setTextColor(
                          Color.BLACK
                  );

                  title.setGravity(
                          Gravity.CENTER
                  );

                  root.addView(title);

                  TextView info =
                          new TextView(this);

                  info.setText(
                          "\nV15.1需要以下权限：\n\n" +
                          "① 位置权限\n" +
                          "用于获取手机当前位置的实时气温。\n\n" +
                          "② 身体活动权限\n" +
                          "用于读取手机计步传感器。\n\n" +
                          "请点击下面按钮允许权限。"
                  );

                  info.setTextSize(17);

                  info.setTextColor(
                          Color.DKGRAY
                  );

                  info.setGravity(
                          Gravity.CENTER_HORIZONTAL
                  );

                  root.addView(
                          info,
                          new LinearLayout.LayoutParams(
                                  LinearLayout.LayoutParams.MATCH_PARENT,
                                  0,
                                  1f
                          )
                  );

                  Button button =
                          new Button(this);

                  button.setText(
                          "允许权限并继续"
                  );

                  button.setAllCaps(false);

                  button.setOnClickListener(
                          v -> requestNeeded()
                  );

                  root.addView(
                          button,
                          new LinearLayout.LayoutParams(
                                  LinearLayout.LayoutParams.MATCH_PARENT,
                                  dp(60)
                          )
                  );

                  setContentView(root);
              }

              private void requestNeeded() {

                  if (
                      Build.VERSION.SDK_INT <
                      Build.VERSION_CODES.M
                  ) {

                      finishWithResult();

                      return;
                  }

                  ArrayList<String> list =
                          new ArrayList<>();

                  if (
                      checkSelfPermission(
                              Manifest.permission.ACCESS_FINE_LOCATION
                      ) != PackageManager.PERMISSION_GRANTED
                  ) {

                      list.add(
                              Manifest.permission.ACCESS_FINE_LOCATION
                      );
                  }

                  if (
                      checkSelfPermission(
                              Manifest.permission.ACCESS_COARSE_LOCATION
                      ) != PackageManager.PERMISSION_GRANTED
                  ) {

                      list.add(
                              Manifest.permission.ACCESS_COARSE_LOCATION
                      );
                  }

                  if (
                      Build.VERSION.SDK_INT >= 29 &&
                      checkSelfPermission(
                              Manifest.permission.ACTIVITY_RECOGNITION
                      ) != PackageManager.PERMISSION_GRANTED
                  ) {

                      list.add(
                              Manifest.permission.ACTIVITY_RECOGNITION
                      );
                  }

                  if (list.isEmpty()) {

                      finishWithResult();

                  } else {

                      requestPermissions(
                              list.toArray(
                                      new String[0]
                              ),
                              REQUEST_CODE
                      );
                  }
              }

              @Override
              public void onRequestPermissionsResult(
                      int requestCode,
                      String[] permissions,
                      int[] grantResults
              ) {

                  super.onRequestPermissionsResult(
                          requestCode,
                          permissions,
                          grantResults
                  );

                  if (
                      requestCode ==
                      REQUEST_CODE
                  ) {

                      finishWithResult();
                  }
              }

              private void finishWithResult() {

                  setResult(RESULT_OK);

                  finish();
              }
          }
