name: Build Floating Input APK V4

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Create Android Project
        shell: bash
        run: |
          rm -rf app
          mkdir -p app/src/main/java/com/jiexin/floatinginput
          mkdir -p app/src/main/res/values

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "FloatingInputApp"
          include ":app"
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.jiexin.floatinginput'
              compileSdk 35

              defaultConfig {
                  applicationId "com.jiexin.floatinginput"
                  minSdk 23
                  targetSdk 35
                  versionCode 4
                  versionName "4.0"
              }
          }
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#3F51B5</item>
                  <item name="android:windowLightStatusBar">true</item>
                  <item name="android:statusBarColor">#FFFFFF</item>
                  <item name="android:navigationBarColor">#FFFFFF</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />

              <application
                  android:allowBackup="false"
                  android:label="悬浮输入框"
                  android:theme="@style/AppTheme"
                  android:supportsRtl="true">

                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="portrait"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

                  <activity
                      android:name=".SettingsActivity"
                      android:screenOrientation="portrait"
                      android:exported="false" />

                  <service
                      android:name=".FloatingService"
                      android:exported="false"
                      android:foregroundServiceType="specialUse">

                      <property
                          android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE"
                          android:value="User controlled floating text input overlay" />

                  </service>

              </application>

          </manifest>
          EOF

          cat > app/src/main/java/com/jiexin/floatinginput/MainActivity.java <<'EOF'
          package com.jiexin.floatinginput;

          import android.app.Activity;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.provider.Settings;
          import android.widget.Toast;

          public class MainActivity extends Activity {

              private boolean permissionRequested = false;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  openFloatingInput();
              }

              @Override
              protected void onResume() {
                  super.onResume();

                  if (permissionRequested &&
                          Settings.canDrawOverlays(this)) {

                      permissionRequested = false;
                      startFloatingService();
                      moveTaskToBack(true);
                  }
              }

              private void openFloatingInput() {

                  if (Settings.canDrawOverlays(this)) {

                      startFloatingService();
                      moveTaskToBack(true);

                  } else {

                      permissionRequested = true;

                      Toast.makeText(
                              this,
                              "第一次使用，请开启“显示在其他应用上层”权限",
                              Toast.LENGTH_LONG
                      ).show();

                      Intent intent = new Intent(
                              Settings.ACTION_MANAGE_OVERLAY_PERMISSION,
                              Uri.parse("package:" + getPackageName())
                      );

                      startActivity(intent);
                  }
              }

              private void startFloatingService() {

                  Intent serviceIntent =
                          new Intent(this, FloatingService.class);

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      startForegroundService(serviceIntent);
                  } else {
                      startService(serviceIntent);
                  }
              }
          }
          EOF

          cat > app/src/main/java/com/jiexin/floatinginput/SettingsActivity.java <<'EOF'
          package com.jiexin.floatinginput;

          import android.app.Activity;
          import android.content.Intent;
          import android.graphics.Color;
          import android.net.Uri;
          import android.os.Bundle;
          import android.provider.Settings;
          import android.view.ViewGroup;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.TextView;
          import android.widget.Toast;

          public class SettingsActivity extends Activity {

              private int dp(int value) {
                  return (int) (
                          value *
                          getResources().getDisplayMetrics().density
                  );
              }

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(
                          dp(22),
                          dp(35),
                          dp(22),
                          dp(25)
                  );

                  root.setBackgroundColor(
                          Color.rgb(245, 247, 250)
                  );

                  TextView title = new TextView(this);
                  title.setText("悬浮输入框设置");
                  title.setTextSize(27);
                  title.setTextColor(
                          Color.rgb(25, 35, 50)
                  );
                  title.setPadding(
                          0,
                          0,
                          0,
                          dp(18)
                  );

                  root.addView(title);

                  TextView info = new TextView(this);

                  info.setText(
                          "使用说明\n\n" +
                          "• 点击输入框：直接输入文字\n\n" +
                          "• 按住顶部“⇕ 移动”并拖动：立即移动整个悬浮框\n\n" +
                          "• 拖动右下角 ↘：自由改变宽度和高度\n\n" +
                          "• − / +：调节透明度\n\n" +
                          "• 透明度：90%、70%、50%、40%、30%、20%\n\n" +
                          "• 顶部关闭：关闭悬浮窗并退出整个程序\n\n" +
                          "• 顶部设置：打开此设置页面"
                  );

                  info.setTextSize(17);
                  info.setTextColor(Color.DKGRAY);
                  info.setLineSpacing(0, 1.2f);

                  root.addView(
                          info,
                          new LinearLayout.LayoutParams(
                                  ViewGroup.LayoutParams.MATCH_PARENT,
                                  0,
                                  1f
                          )
                  );

                  Button permission = new Button(this);
                  permission.setText("悬浮窗权限设置");
                  permission.setAllCaps(false);

                  permission.setOnClickListener(v -> {

                      Intent intent = new Intent(
                              Settings.ACTION_MANAGE_OVERLAY_PERMISSION,
                              Uri.parse(
                                      "package:" +
                                      getPackageName()
                              )
                      );

                      startActivity(intent);
                  });

                  LinearLayout.LayoutParams buttonLp =
                          new LinearLayout.LayoutParams(
                                  ViewGroup.LayoutParams.MATCH_PARENT,
                                  dp(58)
                          );

                  buttonLp.bottomMargin = dp(12);

                  root.addView(
                          permission,
                          buttonLp
                  );

                  Button reset = new Button(this);
                  reset.setText("恢复默认位置、大小和透明度");
                  reset.setAllCaps(false);

                  reset.setOnClickListener(v -> {

                      getSharedPreferences(
                              "floating_settings",
                              MODE_PRIVATE
                      )
                      .edit()
                      .clear()
                      .apply();

                      Toast.makeText(
                              this,
                              "已恢复默认设置",
                              Toast.LENGTH_SHORT
                      ).show();

                      stopService(
                              new Intent(
                                      this,
                                      FloatingService.class
                              )
                      );

                      finish();
                  });

                  LinearLayout.LayoutParams resetLp =
                          new LinearLayout.LayoutParams(
                                  ViewGroup.LayoutParams.MATCH_PARENT,
                                  dp(58)
                          );

                  resetLp.bottomMargin = dp(12);

                  root.addView(
                          reset,
                          resetLp
                  );

                  Button back = new Button(this);
                  back.setText("返回悬浮输入框");
                  back.setAllCaps(false);

                  back.setOnClickListener(v ->
                          finish()
                  );

                  root.addView(
                          back,
                          new LinearLayout.LayoutParams(
                                  ViewGroup.LayoutParams.MATCH_PARENT,
                                  dp(58)
                          )
                  );

                  setContentView(root);
              }
          }
          EOF

          cat > app/src/main/java/com/jiexin/floatinginput/FloatingService.java <<'EOF'
          package com.jiexin.floatinginput;

          import android.app.ActivityManager;
          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.app.Service;

          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;

          import android.graphics.Color;
          import android.graphics.PixelFormat;
          import android.graphics.drawable.GradientDrawable;

          import android.os.Build;
          import android.os.IBinder;

          import android.view.Gravity;
          import android.view.MotionEvent;
          import android.view.ViewGroup;
          import android.view.WindowManager;

          import android.widget.Button;
          import android.widget.EditText;
          import android.widget.FrameLayout;
          import android.widget.LinearLayout;
          import android.widget.TextView;

          public class FloatingService extends Service {

              private static final String CHANNEL_ID =
                      "floating_input_channel_v4";

              private static final int NOTIFICATION_ID =
                      1004;

              private WindowManager windowManager;
              private LinearLayout rootView;
              private EditText inputBox;
              private TextView alphaText;
              private TextView resizeHandle;
              private TextView moveHandle;
              private WindowManager.LayoutParams params;
              private SharedPreferences prefs;

              private final float[] alphaLevels = {
                      0.90f,
                      0.70f,
                      0.50f,
                      0.40f,
                      0.30f,
                      0.20f
              };

              private final String[] alphaLabels = {
                      "90%",
                      "70%",
                      "50%",
                      "40%",
                      "30%",
                      "20%"
              };

              private int alphaIndex = 0;

              private float moveDownRawX;
              private float moveDownRawY;
              private int moveStartX;
              private int moveStartY;

              private float resizeRawX;
              private float resizeRawY;
              private int startWidth;
              private int startHeight;

              private int dp(int value) {

                  return (int) (
                          value *
                          getResources()
                                  .getDisplayMetrics()
                                  .density
                  );
              }

              @Override
              public void onCreate() {

                  super.onCreate();

                  prefs = getSharedPreferences(
                          "floating_settings",
                          MODE_PRIVATE
                  );

                  createNotificationChannel();

                  startForeground(
                          NOTIFICATION_ID,
                          createNotification()
                  );

                  windowManager =
                          (WindowManager)
                          getSystemService(
                                  WINDOW_SERVICE
                          );

                  createFloatingWindow();
              }

              @Override
              public int onStartCommand(
                      Intent intent,
                      int flags,
                      int startId
              ) {

                  return START_STICKY;
              }

              private void createNotificationChannel() {

                  if (Build.VERSION.SDK_INT >=
                          Build.VERSION_CODES.O) {

                      NotificationChannel channel =
                              new NotificationChannel(
                                      CHANNEL_ID,
                                      "悬浮输入框",
                                      NotificationManager.IMPORTANCE_LOW
                              );

                      channel.setDescription(
                              "保持悬浮输入框运行"
                      );

                      channel.setShowBadge(false);

                      NotificationManager manager =
                              getSystemService(
                                      NotificationManager.class
                              );

                      manager.createNotificationChannel(
                              channel
                      );
                  }
              }

              private Notification createNotification() {

                  Intent intent =
                          new Intent(
                                  this,
                                  SettingsActivity.class
                          );

                  PendingIntent pendingIntent =
                          PendingIntent.getActivity(
                                  this,
                                  0,
                                  intent,
                                  PendingIntent.FLAG_UPDATE_CURRENT |
                                  PendingIntent.FLAG_IMMUTABLE
                          );

                  Notification.Builder builder;

                  if (Build.VERSION.SDK_INT >=
                          Build.VERSION_CODES.O) {

                      builder =
                              new Notification.Builder(
                                      this,
                                      CHANNEL_ID
                              );

                  } else {

                      builder =
                              new Notification.Builder(
                                      this
                              );
                  }

                  return builder
                          .setContentTitle(
                                  "悬浮输入框正在运行"
                          )
                          .setContentText(
                                  "点击打开设置"
                          )
                          .setSmallIcon(
                                  android.R.drawable.ic_menu_edit
                          )
                          .setContentIntent(
                                  pendingIntent
                          )
                          .setOngoing(true)
                          .build();
              }

              private GradientDrawable background(
                      int color,
                      int radius,
                      Integer strokeColor
              ) {

                  GradientDrawable drawable =
                          new GradientDrawable();

                  drawable.setColor(color);

                  drawable.setCornerRadius(
                          dp(radius)
                  );

                  if (strokeColor != null) {

                      drawable.setStroke(
                              dp(1),
                              strokeColor
                      );
                  }

                  return drawable;
              }

              private TextView createTopButton(
                      String text
              ) {

                  TextView button =
                          new TextView(this);

                  button.setText(text);
                  button.setTextSize(15);
                  button.setGravity(Gravity.CENTER);

                  button.setTextColor(
                          Color.rgb(35, 35, 35)
                  );

                  button.setBackground(
                          background(
                                  Color.rgb(
                                          238,
                                          241,
                                          246
                                  ),
                                  7,
                                  Color.rgb(
                                          200,
                                          205,
                                          215
                                  )
                          )
                  );

                  return button;
              }

              private void createFloatingWindow() {

                  if (rootView != null) {
                      return;
                  }

                  rootView =
                          new LinearLayout(this);

                  rootView.setOrientation(
                          LinearLayout.VERTICAL
                  );

                  rootView.setPadding(
                          dp(7),
                          dp(7),
                          dp(7),
                          dp(7)
                  );

                  rootView.setBackground(
                          background(
                                  Color.WHITE,
                                  12,
                                  Color.rgb(
                                          80,
                                          80,
                                          80
                                  )
                          )
                  );

                  LinearLayout topBar =
                          new LinearLayout(this);

                  topBar.setOrientation(
                          LinearLayout.HORIZONTAL
                  );

                  topBar.setGravity(
                          Gravity.CENTER_VERTICAL
                  );

                  TextView closeButton =
                          createTopButton("关闭");

                  TextView settingsButton =
                          createTopButton("设置");

                  moveHandle =
                          createTopButton("⇕ 移动");

                  LinearLayout.LayoutParams closeLp =
                          new LinearLayout.LayoutParams(
                                  0,
                                  dp(42),
                                  1f
                          );

                  closeLp.setMargins(
                          dp(2),
                          dp(2),
                          dp(2),
                          dp(4)
                  );

                  topBar.addView(
                          closeButton,
                          closeLp
                  );

                  LinearLayout.LayoutParams settingsLp =
                          new LinearLayout.LayoutParams(
                                  0,
                                  dp(42),
                                  1f
                          );

                  settingsLp.setMargins(
                          dp(2),
                          dp(2),
                          dp(2),
                          dp(4)
                  );

                  topBar.addView(
                          settingsButton,
                          settingsLp
                  );

                  LinearLayout.LayoutParams moveLp =
                          new LinearLayout.LayoutParams(
                                  0,
                                  dp(42),
                                  1f
                          );

                  moveLp.setMargins(
                          dp(2),
                          dp(2),
                          dp(2),
                          dp(4)
                  );

                  topBar.addView(
                          moveHandle,
                          moveLp
                  );

                  rootView.addView(
                          topBar,
                          new LinearLayout.LayoutParams(
                                  ViewGroup.LayoutParams.MATCH_PARENT,
                                  dp(48)
                          )
                  );

                  FrameLayout inputFrame =
                          new FrameLayout(this);

                  inputBox =
                          new EditText(this);

                  inputBox.setHint(
                          "点击这里输入文字"
                  );

                  inputBox.setTextSize(18);

                  inputBox.setGravity(
                          Gravity.TOP |
                          Gravity.START
                  );

                  inputBox.setTextColor(
                          Color.BLACK
                  );

                  inputBox.setHintTextColor(
                          Color.GRAY
                  );

                  inputBox.setSingleLine(false);
                  inputBox.setMinLines(2);

                  inputBox.setPadding(
                          dp(12),
                          dp(10),
                          dp(50),
                          dp(48)
                  );

                  inputBox.setBackground(
                          background(
                                  Color.WHITE,
                                  8,
                                  Color.LTGRAY
                          )
                  );

                  inputFrame.addView(
                          inputBox,
                          new FrameLayout.LayoutParams(
                                  ViewGroup.LayoutParams.MATCH_PARENT,
                                  ViewGroup.LayoutParams.MATCH_PARENT
                          )
                  );

                  resizeHandle =
                          new TextView(this);

                  resizeHandle.setText("↘");
                  resizeHandle.setTextSize(28);
                  resizeHandle.setGravity(Gravity.CENTER);

                  resizeHandle.setTextColor(
                          Color.rgb(
                                  40,
                                  90,
                                  190
                          )
                  );

                  resizeHandle.setBackground(
                          background(
                                  Color.argb(
                                          70,
                                          80,
                                          120,
                                          220
                                  ),
                                  8,
                                  null
                          )
                  );

                  FrameLayout.LayoutParams resizeLp =
                          new FrameLayout.LayoutParams(
                                  dp(46),
                                  dp(46),
                                  Gravity.BOTTOM |
                                  Gravity.END
                          );

                  inputFrame.addView(
                          resizeHandle,
                          resizeLp
                  );

                  rootView.addView(
                          inputFrame,
                          new LinearLayout.LayoutParams(
                                  ViewGroup.LayoutParams.MATCH_PARENT,
                                  0,
                                  1f
                          )
                  );

                  LinearLayout controls =
                          new LinearLayout(this);

                  controls.setOrientation(
                          LinearLayout.HORIZONTAL
                  );

                  controls.setGravity(
                          Gravity.CENTER_VERTICAL
                  );

                  controls.setPadding(
                          0,
                          dp(4),
                          0,
                          0
                  );

                  Button minus =
                          new Button(this);

                  minus.setText("−");
                  minus.setTextSize(23);
                  minus.setAllCaps(false);
                  minus.setPadding(0, 0, 0, 0);

                  Button plus =
                          new Button(this);

                  plus.setText("+");
                  plus.setTextSize(23);
                  plus.setAllCaps(false);
                  plus.setPadding(0, 0, 0, 0);

                  alphaText =
                          new TextView(this);

                  alphaText.setTextSize(16);

                  alphaText.setGravity(
                          Gravity.CENTER
                  );

                  alphaText.setTextColor(
                          Color.DKGRAY
                  );

                  minus.setOnClickListener(v -> {

                      if (
                          alphaIndex <
                          alphaLevels.length - 1
                      ) {

                          alphaIndex++;

                          updateAlpha();
                          saveSettings();
                      }
                  });

                  plus.setOnClickListener(v -> {

                      if (alphaIndex > 0) {

                          alphaIndex--;

                          updateAlpha();
                          saveSettings();
                      }
                  });

                  controls.addView(
                          minus,
                          new LinearLayout.LayoutParams(
                                  dp(65),
                                  dp(50)
                          )
                  );

                  controls.addView(
                          alphaText,
                          new LinearLayout.LayoutParams(
                                  0,
                                  dp(50),
                                  1f
                          )
                  );

                  controls.addView(
                          plus,
                          new LinearLayout.LayoutParams(
                                  dp(65),
                                  dp(50)
                          )
                  );

                  rootView.addView(
                          controls,
                          new LinearLayout.LayoutParams(
                                  ViewGroup.LayoutParams.MATCH_PARENT,
                                  dp(55)
                          )
                  );

                  int type;

                  if (Build.VERSION.SDK_INT >=
                          Build.VERSION_CODES.O) {

                      type =
                              WindowManager.LayoutParams
                                      .TYPE_APPLICATION_OVERLAY;

                  } else {

                      type =
                              WindowManager.LayoutParams
                                      .TYPE_PHONE;
                  }

                  int width =
                          prefs.getInt(
                                  "width",
                                  dp(330)
                          );

                  int height =
                          prefs.getInt(
                                  "height",
                                  dp(300)
                          );

                  alphaIndex =
                          prefs.getInt(
                                  "alpha",
                                  0
                          );

                  if (
                      alphaIndex < 0 ||
                      alphaIndex >=
                      alphaLevels.length
                  ) {

                      alphaIndex = 0;
                  }

                  params =
                          new WindowManager.LayoutParams(
                                  width,
                                  height,
                                  type,
                                  WindowManager.LayoutParams.FLAG_NOT_TOUCH_MODAL |
                                  WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN,
                                  PixelFormat.TRANSLUCENT
                          );

                  params.gravity =
                          Gravity.TOP |
                          Gravity.START;

                  params.x =
                          prefs.getInt(
                                  "x",
                                  dp(25)
                          );

                  params.y =
                          prefs.getInt(
                                  "y",
                                  dp(100)
                          );

                  params.softInputMode =
                          WindowManager.LayoutParams
                                  .SOFT_INPUT_ADJUST_RESIZE;

                  try {

                      windowManager.addView(
                              rootView,
                              params
                      );

                  } catch (Exception e) {

                      rootView = null;
                      stopSelf();
                      return;
                  }

                  updateAlpha();

                  setupCloseButton(
                          closeButton
                  );

                  setupSettingsButton(
                          settingsButton
                  );

                  setupMoveHandle();
                  setupResize();
              }

              private void setupCloseButton(
                      TextView closeButton
              ) {

                  closeButton.setOnClickListener(v -> {

                      saveSettings();

                      /*
                       * 关闭整个程序：
                       * 1. 移除悬浮窗
                       * 2. 停止前台服务
                       * 3. 移除 APP 任务
                       */

                      try {

                          ActivityManager activityManager =
                                  (ActivityManager)
                                  getSystemService(
                                          Context.ACTIVITY_SERVICE
                                  );

                          if (activityManager != null) {

                              for (
                                  ActivityManager.AppTask task :
                                  activityManager.getAppTasks()
                              ) {

                                  task.finishAndRemoveTask();
                              }
                          }

                      } catch (Exception ignored) {
                      }

                      stopSelf();
                  });
              }

              private void setupSettingsButton(
                      TextView settingsButton
              ) {

                  settingsButton.setOnClickListener(v -> {

                      Intent intent =
                              new Intent(
                                      this,
                                      SettingsActivity.class
                              );

                      intent.addFlags(
                              Intent.FLAG_ACTIVITY_NEW_TASK |
                              Intent.FLAG_ACTIVITY_CLEAR_TOP
                      );

                      startActivity(intent);
                  });
              }

              /*
               * V4：
               * 不需要再长按2秒。
               * 手指按住“移动”按钮后，
               * 直接拖动即可移动整个悬浮框。
               */
              private void setupMoveHandle() {

                  moveHandle.setOnTouchListener(
                          (view, event) -> {

                      switch (
                              event.getActionMasked()
                      ) {

                          case MotionEvent.ACTION_DOWN:

                              moveDownRawX =
                                      event.getRawX();

                              moveDownRawY =
                                      event.getRawY();

                              moveStartX =
                                      params.x;

                              moveStartY =
                                      params.y;

                              moveHandle.setText(
                                      "⇕ 移动中"
                              );

                              return true;

                          case MotionEvent.ACTION_MOVE:

                              float dx =
                                      event.getRawX() -
                                      moveDownRawX;

                              float dy =
                                      event.getRawY() -
                                      moveDownRawY;

                              params.x =
                                      moveStartX +
                                      (int) dx;

                              params.y =
                                      moveStartY +
                                      (int) dy;

                              try {

                                  windowManager.updateViewLayout(
                                          rootView,
                                          params
                                  );

                              } catch (
                                      Exception ignored
                              ) {
                              }

                              return true;

                          case MotionEvent.ACTION_UP:

                          case MotionEvent.ACTION_CANCEL:

                              saveSettings();

                              moveHandle.setText(
                                      "⇕ 移动"
                              );

                              return true;
                      }

                      return true;
                  });
              }

              private void setupResize() {

                  resizeHandle.setOnTouchListener(
                          (view, event) -> {

                      switch (
                              event.getActionMasked()
                      ) {

                          case MotionEvent.ACTION_DOWN:

                              resizeRawX =
                                      event.getRawX();

                              resizeRawY =
                                      event.getRawY();

                              startWidth =
                                      params.width;

                              startHeight =
                                      params.height;

                              return true;

                          case MotionEvent.ACTION_MOVE:

                              int dx =
                                      (int) (
                                          event.getRawX() -
                                          resizeRawX
                                      );

                              int dy =
                                      (int) (
                                          event.getRawY() -
                                          resizeRawY
                                      );

                              int screenWidth =
                                      getResources()
                                              .getDisplayMetrics()
                                              .widthPixels;

                              int screenHeight =
                                      getResources()
                                              .getDisplayMetrics()
                                              .heightPixels;

                              int newWidth =
                                      startWidth + dx;

                              int newHeight =
                                      startHeight + dy;

                              newWidth =
                                      Math.max(
                                              dp(230),
                                              Math.min(
                                                      newWidth,
                                                      screenWidth
                                              )
                                      );

                              newHeight =
                                      Math.max(
                                              dp(210),
                                              Math.min(
                                                      newHeight,
                                                      screenHeight
                                              )
                                      );

                              params.width =
                                      newWidth;

                              params.height =
                                      newHeight;

                              try {

                                  windowManager.updateViewLayout(
                                          rootView,
                                          params
                                  );

                              } catch (
                                      Exception ignored
                              ) {
                              }

                              return true;

                          case MotionEvent.ACTION_UP:

                          case MotionEvent.ACTION_CANCEL:

                              saveSettings();
                              return true;
                      }

                      return false;
                  });
              }

              private void updateAlpha() {

                  if (rootView == null) {
                      return;
                  }

                  rootView.setAlpha(
                          alphaLevels[
                                  alphaIndex
                          ]
                  );

                  alphaText.setText(
                          alphaLabels[
                                  alphaIndex
                          ]
                  );
              }

              private void saveSettings() {

                  if (params == null) {
                      return;
                  }

                  prefs.edit()
                          .putInt(
                                  "x",
                                  params.x
                          )
                          .putInt(
                                  "y",
                                  params.y
                          )
                          .putInt(
                                  "width",
                                  params.width
                          )
                          .putInt(
                                  "height",
                                  params.height
                          )
                          .putInt(
                                  "alpha",
                                  alphaIndex
                          )
                          .apply();
              }

              @Override
              public void onDestroy() {

                  saveSettings();

                  if (
                      windowManager != null &&
                      rootView != null
                  ) {

                      try {

                          windowManager.removeView(
                                  rootView
                          );

                      } catch (
                              Exception ignored
                      ) {
                      }
                  }

                  rootView = null;

                  if (
                      Build.VERSION.SDK_INT >=
                      Build.VERSION_CODES.N
                  ) {

                      stopForeground(
                              STOP_FOREGROUND_REMOVE
                      );

                  } else {

                      stopForeground(true);
                  }

                  super.onDestroy();
              }

              @Override
              public IBinder onBind(
                      Intent intent
              ) {

                  return null;
              }
          }
          EOF

      - name: Install Gradle
        shell: bash
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle-8.9-bin.zip
          ./gradle-8.9/bin/gradle wrapper --gradle-version 8.9
          chmod +x gradlew

      - name: Build APK
        shell: bash
        run: |
          ./gradlew assembleDebug

      - name: Prepare APK
        shell: bash
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk FloatingInputApp-V4.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FloatingInputApp-V4-APK
          path: FloatingInputApp-V4.apk
          retention-days: 30
