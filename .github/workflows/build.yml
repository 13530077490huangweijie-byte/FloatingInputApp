          package com.jiexin.floatinginput;

          import android.app.Activity;
          import android.content.Intent;
          import android.graphics.Color;
          import android.os.Bundle;
          import android.view.WindowManager;
          import android.widget.FrameLayout;

          public class BackCatcherActivity extends Activity {

              private long firstBackTime =
                      0;

              @Override
              protected void onCreate(
                      Bundle savedInstanceState
              ) {

                  super.onCreate(
                          savedInstanceState
                  );

                  getWindow().setDimAmount(
                          0f
                  );

                  getWindow().setSoftInputMode(
                          WindowManager.LayoutParams
                                  .SOFT_INPUT_ADJUST_NOTHING
                  );

                  FrameLayout invisible =
                          new FrameLayout(
                                  this
                          );

                  invisible.setBackgroundColor(
                          Color.TRANSPARENT
                  );

                  setContentView(
                          invisible
                  );
              }

              @Override
              public void onBackPressed() {

                  long now =
                          System.currentTimeMillis();

                  if (
                      firstBackTime == 0 ||
                      now - firstBackTime > 2000
                  ) {

                      firstBackTime =
                              now;

                      Intent intent =
                              new Intent(
                                      this,
                                      FloatingService.class
                              );

                      intent.setAction(
                              "FIRST_BACK"
                      );

                      startService(
                              intent
                      );

                      return;
                  }

                  Intent intent =
                          new Intent(
                                  this,
                                  FloatingService.class
                          );

                  intent.setAction(
                          "DOUBLE_BACK_CLOSE"
                  );

                  startService(
                          intent
                  );

                  finishAndRemoveTask();
              }
          }
