          package com.jiexin.floatinginput;

          import android.content.Context;
          import android.content.SharedPreferences;

          import org.json.JSONArray;
          import org.json.JSONObject;

          import java.util.ArrayList;
          import java.util.List;

          public class HistoryManager {

              public static class Item {

                  public String text;
                  public String type;
                  public long time;

                  public Item(
                          String text,
                          String type,
                          long time
                  ) {
                      this.text = text;
                      this.type = type;
                      this.time = time;
                  }
              }

              private static final String PREF =
                      "history_data";

              private static final String KEY =
                      "items";

              public static synchronized List<Item> load(
                      Context context
              ) {

                  List<Item> result =
                          new ArrayList<>();

                  SharedPreferences prefs =
                          context.getSharedPreferences(
                                  PREF,
                                  Context.MODE_PRIVATE
                          );

                  String raw =
                          prefs.getString(
                                  KEY,
                                  "[]"
                          );

                  try {

                      JSONArray array =
                              new JSONArray(raw);

                      for (
                          int i = 0;
                          i < array.length();
                          i++
                      ) {

                          JSONObject object =
                                  array.getJSONObject(i);

                          result.add(
                                  new Item(
                                          object.optString(
                                                  "text",
                                                  ""
                                          ),
                                          object.optString(
                                                  "type",
                                                  "输入"
                                          ),
                                          object.optLong(
                                                  "time",
                                                  0
                                          )
                                  )
                          );
                      }

                  } catch (Exception ignored) {
                  }

                  return result;
              }

              public static synchronized void save(
                      Context context,
                      List<Item> items
              ) {

                  JSONArray array =
                          new JSONArray();

                  try {

                      for (Item item : items) {

                          JSONObject object =
                                  new JSONObject();

                          object.put(
                                  "text",
                                  item.text
                          );

                          object.put(
                                  "type",
                                  item.type
                          );

                          object.put(
                                  "time",
                                  item.time
                          );

                          array.put(object);
                      }

                  } catch (Exception ignored) {
                  }

                  context
                          .getSharedPreferences(
                                  PREF,
                                  Context.MODE_PRIVATE
                          )
                          .edit()
                          .putString(
                                  KEY,
                                  array.toString()
                          )
                          .apply();
              }

              public static synchronized void add(
                      Context context,
                      String text,
                      String type
              ) {

                  if (text == null) {
                      return;
                  }

                  text = text.trim();

                  if (text.isEmpty()) {
                      return;
                  }

                  List<Item> items =
                          load(context);

                  for (
                      int i = items.size() - 1;
                      i >= 0;
                      i--
                  ) {

                      if (
                          items.get(i)
                                  .text
                                  .equals(text)
                      ) {

                          items.remove(i);
                      }
                  }

                  items.add(
                          0,
                          new Item(
                                  text,
                                  type,
                                  System.currentTimeMillis()
                          )
                  );

                  while (
                      items.size() > 500
                  ) {

                      items.remove(
                              items.size() - 1
                      );
                  }

                  save(
                          context,
                          items
                  );
              }

              public static synchronized void clear(
                      Context context
              ) {

                  context
                          .getSharedPreferences(
                                  PREF,
                                  Context.MODE_PRIVATE
                          )
                          .edit()
                          .remove(KEY)
                          .apply();
              }
          }
          EOF

          cat > app/src/main/java/com/jiexin/floatinginput/MainActivity.java <<'EOF'
          package com.jiexin.floatinginput;

          import android.app.Activity;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.provider.Settings;
          import android.widget.Toast;

          public class MainActivity extends Activity {

              private boolean permissionRequested =
                      false;

              @Override
              protected void onCreate(
                      Bundle savedInstanceState
              ) {

                  super.onCreate(
                          savedInstanceState
                  );

                  /*
                   * V9：
                   * 每次从图标重新打开程序，
                   * 强制把透明度恢复成第0档 = 90%。
                   *
                   * 位置和大小不会清除。
                   */
                  getSharedPreferences(
                          "floating_settings",
                          MODE_PRIVATE
                  )
                  .edit()
                  .putInt(
                          "alpha",
                          0
                  )
                  .apply();

                  openFloatingInput();
              }

              @Override
              protected void onResume() {

                  super.onResume();

                  if (
                      permissionRequested &&
                      Settings.canDrawOverlays(this)
                  ) {

                      permissionRequested =
                              false;

                      startFloatingService();

                      openBackCatcher();
                  }
              }

              private void openFloatingInput() {

                  if (
                      Settings.canDrawOverlays(this)
                  ) {

                      startFloatingService();

                      openBackCatcher();

                  } else {

                      permissionRequested =
                              true;

                      Toast.makeText(
                              this,
                              "第一次使用，请开启“显示在其他应用上层”权限",
                              Toast.LENGTH_LONG
                      ).show();

                      Intent intent =
                              new Intent(
                                      Settings.ACTION_MANAGE_OVERLAY_PERMISSION,
                                      Uri.parse(
                                              "package:" +
                                              getPackageName()
                                      )
                              );

                      startActivity(intent);
                  }
              }

              private void startFloatingService() {

                  Intent intent =
                          new Intent(
                                  this,
                                  FloatingService.class
                          );

                  intent.setAction(
                          "OPEN_AND_KEYBOARD"
                  );

                  if (
                      Build.VERSION.SDK_INT >=
                      Build.VERSION_CODES.O
                  ) {

                      startForegroundService(
                              intent
                      );

                  } else {

                      startService(
                              intent
                      );
                  }
              }

              private void openBackCatcher() {

                  Intent intent =
                          new Intent(
                                  this,
                                  BackCatcherActivity.class
                          );

                  startActivity(intent);

                  finish();
              }
          }
          EOF

